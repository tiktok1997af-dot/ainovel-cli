name: G05.5 W6C Timeout Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: g05-5-w6c-diagnostic-${{ github.head_ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: 1b5f677ae6f2434a67d1afd0e8410342440d2b9f
  SOURCE_RUN_ID: '34604838975'
  SOURCE_ARTIFACT: ainovel-w6c-release-input-1b5f677ae6f2434a67d1afd0e8410342440d2b9f

jobs:
  diagnostic:
    if: github.head_ref == 'diag/g05-5-w6c-timeout-1b5f677'
    name: Exact-parent packaged WEB-only timeout diagnostic
    runs-on: [self-hosted, Windows, X64, ainovel-w5e-desktop]
    timeout-minutes: 35
    steps:
      - name: Checkout exact parent product/scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Download exact prior release input
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: ${{ runner.temp }}/g05-5-diag-input-${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: tiktok1997af-dot/ainovel-cli
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Prepare exact-parent diagnostic environment
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:TARGET_SHA) { throw "Diagnostic parent drift: expected $env:TARGET_SHA got $actual" }
          $inputDir = Join-Path $env:RUNNER_TEMP ("g05-5-diag-input-" + $env:GITHUB_RUN_ID)
          $evidenceDir = Join-Path $env:RUNNER_TEMP ("g05-5-diag-evidence-" + $env:GITHUB_RUN_ID)
          $runtimeDir = Join-Path $env:RUNNER_TEMP ("g05-5-diag-runtime-" + $env:GITHUB_RUN_ID)
          foreach ($path in @($evidenceDir, $runtimeDir)) {
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $path | Out-Null
          }
          $provFile = @(Get-ChildItem -LiteralPath $inputDir -Filter 'w6c-package-provenance.json' -File -Recurse)
          if ($provFile.Count -ne 1) { throw 'Expected exactly one package provenance file.' }
          $prov = Get-Content -LiteralPath $provFile[0].FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$prov.candidate_sha -ne $env:TARGET_SHA) { throw 'Prior release input is not the exact diagnostic parent.' }
          if ([string]$prov.w55_no_api -ne 'PASS' -or -not [bool]$prov.no_publish) { throw 'NO-API/no-publish provenance missing.' }
          $archive = @(Get-ChildItem -LiteralPath $inputDir -Filter ([string]$prov.archive_name) -File -Recurse)
          $manifest = @(Get-ChildItem -LiteralPath $inputDir -Filter 'ainovel-cli_checksums.txt' -File -Recurse)
          $helper = @(Get-ChildItem -LiteralPath $inputDir -Filter 'ainovel-w5e-readiness.exe' -File -Recurse)
          if ($archive.Count -ne 1 -or $manifest.Count -ne 1 -or $helper.Count -ne 1) { throw 'Exact release input bundle incomplete.' }
          $helperHash = (Get-FileHash -LiteralPath $helper[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($helperHash -ne [string]$prov.readiness_helper_sha256) { throw 'Readiness helper hash mismatch.' }
          $envLines = @(
            "DIAG_INPUT_DIR=$inputDir",
            "DIAG_EVIDENCE_DIR=$evidenceDir",
            "DIAG_RUNTIME_DIR=$runtimeDir",
            "DIAG_PACKAGE_ARCHIVE=$($archive[0].FullName)",
            "DIAG_CHECKSUM_MANIFEST=$($manifest[0].FullName)",
            "DIAG_READINESS_EXE=$($helper[0].FullName)",
            "DIAG_READINESS_SHA256=$([string]$prov.readiness_helper_sha256)",
            "DIAG_SNAPSHOT_VERSION=$([string]$prov.snapshot_version)"
          ) -join "`r`n"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, $envLines + "`r`n", (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Diagnostic release input verified at exact parent $actual"

      - name: Stage transient WEB-only config
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $userHome = [Environment]::GetFolderPath('UserProfile')
          $configDir = Join-Path $userHome '.ainovel'
          $configPath = Join-Path $configDir 'config.json'
          $backupPath = Join-Path $env:RUNNER_TEMP ("g05-5-diag-config-backup-" + $env:GITHUB_RUN_ID + ".json")
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          $hadOriginal = Test-Path -LiteralPath $configPath
          $profileName = 'default'
          $browserPath = ''
          $startUrl = ''
          if ($hadOriginal) {
            Copy-Item -LiteralPath $configPath -Destination $backupPath -Force
            try {
              $existing = Get-Content -LiteralPath $configPath -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($null -ne $existing.web) {
                if (-not [string]::IsNullOrWhiteSpace([string]$existing.web.profile_name)) { $profileName = [string]$existing.web.profile_name }
                if (-not [string]::IsNullOrWhiteSpace([string]$existing.web.browser_path)) { $browserPath = [string]$existing.web.browser_path }
                if (-not [string]::IsNullOrWhiteSpace([string]$existing.web.start_url)) { $startUrl = [string]$existing.web.start_url }
              }
            } catch { Write-Host 'Existing config parse failed; exact bytes are backed up.' }
          }
          $web = [ordered]@{ enabled = $true; site = 'gemini-web'; profile_name = $profileName }
          if (-not [string]::IsNullOrWhiteSpace($browserPath)) { $web.browser_path = $browserPath }
          if (-not [string]::IsNullOrWhiteSpace($startUrl)) { $web.start_url = $startUrl }
          $cfg = [ordered]@{ web = $web; language = 'vi' }
          [System.IO.File]::WriteAllText($configPath, (($cfg | ConvertTo-Json -Depth 6) + "`r`n"), (New-Object System.Text.UTF8Encoding($false)))
          $envLines = @(
            "DIAG_LOCAL_CONFIG_PATH=$configPath",
            "DIAG_LOCAL_CONFIG_BACKUP=$backupPath",
            "DIAG_LOCAL_CONFIG_HAD_ORIGINAL=$hadOriginal"
          ) -join "`r`n"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, $envLines + "`r`n", (New-Object System.Text.UTF8Encoding($false)))

      - name: Reproduce exact-parent packaged smoke and capture timeout state
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          function Sanitize([string]$text) {
            if ([string]::IsNullOrEmpty($text)) { return '' }
            $userHome = [Environment]::GetFolderPath('UserProfile')
            if (-not [string]::IsNullOrWhiteSpace($userHome)) { $text = $text.Replace($userHome, '<USERPROFILE>') }
            $text = [regex]::Replace($text, '(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b', '<redacted-email>')
            $text = [regex]::Replace($text, '(?i)\b(cookie|authorization|bearer|token|password|secret|api[_-]?key)\b\s*[:=]\s*[^\s,;]+', '$1=<redacted>')
            $text = [regex]::Replace($text, '(?i)(https?://[^\s?#]+)(?:\?[^\s#]*)?(?:#[^\s]*)?', '$1')
            return $text
          }
          function TailText([string]$path, [int]$count = 160) {
            if (-not (Test-Path -LiteralPath $path)) { return '' }
            $lines = @(Get-Content -LiteralPath $path -Encoding UTF8 -ErrorAction SilentlyContinue)
            if ($lines.Count -gt $count) { $lines = $lines[($lines.Count-$count)..($lines.Count-1)] }
            return (Sanitize ($lines -join "`n"))
          }
          function TryJson([string]$path) {
            if (-not (Test-Path -LiteralPath $path)) { return $null }
            try { return (Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json) } catch { return $null }
          }
          $smokeError = $null
          try {
            & ./scripts/w6c-release-artifact-smoke.ps1 `
              -RepoRoot $env:GITHUB_WORKSPACE `
              -PackageArchivePath $env:DIAG_PACKAGE_ARCHIVE `
              -ChecksumManifestPath $env:DIAG_CHECKSUM_MANIFEST `
              -ReadinessExe $env:DIAG_READINESS_EXE `
              -ExpectedReadinessSha256 $env:DIAG_READINESS_SHA256 `
              -ExpectedGitSha $env:TARGET_SHA `
              -ExpectedSnapshotVersion $env:DIAG_SNAPSHOT_VERSION `
              -EvidenceDir $env:DIAG_EVIDENCE_DIR `
              -RuntimeDir $env:DIAG_RUNTIME_DIR `
              -ReadinessTimeoutSeconds 60 `
              -FirstChapterTimeoutSeconds 1200 `
              -ResumeTimeoutSeconds 1200
          } catch {
            $smokeError = Sanitize ([string]$_.Exception.Message)
          }

          $novel = Join-Path $env:DIAG_RUNTIME_DIR 'output\novel'
          $meta = Join-Path $novel 'meta'
          $progress = TryJson (Join-Path $meta 'progress.json')
          $pending = TryJson (Join-Path $meta 'pending_commit.json')
          $chapters = @(Get-ChildItem -LiteralPath (Join-Path $novel 'chapters') -Filter '*.md' -File -ErrorAction SilentlyContinue)
          $drafts = @(Get-ChildItem -LiteralPath (Join-Path $novel 'drafts') -Filter '*.md' -File -Recurse -ErrorAction SilentlyContinue)
          $sessions = @(Get-ChildItem -LiteralPath (Join-Path $meta 'sessions\agents') -Filter '*.jsonl' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTimeUtc)
          $sessionTail = ''
          $sessionNames = @()
          if ($sessions.Count -gt 0) {
            $sessionNames = @($sessions | ForEach-Object { $_.Name })
            $sessionTail = TailText $sessions[-1].FullName 120
          }
          $fileInventory = @()
          if (Test-Path -LiteralPath $novel) {
            $fileInventory = @(Get-ChildItem -LiteralPath $novel -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              [ordered]@{
                path = $_.FullName.Substring($novel.Length).TrimStart('\').Replace('\','/')
                bytes = $_.Length
                modified_utc = $_.LastWriteTimeUtc.ToString('o')
                sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            })
          }
          $progressView = $null
          if ($null -ne $progress) {
            $progressView = [ordered]@{
              phase = [string]$progress.phase
              flow = [string]$progress.flow
              current_chapter = [int]$progress.current_chapter
              completed_chapters = @($progress.completed_chapters | ForEach-Object { [int]$_ })
              pending_rewrites = @($progress.pending_rewrites | ForEach-Object { [int]$_ })
            }
          }
          $pendingView = $null
          if ($null -ne $pending) {
            $pendingView = [ordered]@{
              chapter = [int]$pending.chapter
              stage = [string]$pending.stage
              rewrite = [bool]$pending.rewrite
              rewrite_mode = [string]$pending.rewrite_mode
              has_payload = ($null -ne $pending.payload)
              has_draft_content = (-not [string]::IsNullOrEmpty([string]$pending.draft_content))
              updated_at = [string]$pending.updated_at
            }
          }
          $diag = [ordered]@{
            schema = 'ainovel-g05-5-w6c-timeout-diagnostic/1'
            target_sha = $env:TARGET_SHA
            source_release_run_id = $env:SOURCE_RUN_ID
            smoke_error = $smokeError
            captured_at = (Get-Date).ToUniversalTime().ToString('o')
            progress = $progressView
            pending_commit = $pendingView
            final_chapter_file_count = $chapters.Count
            draft_file_count = $drafts.Count
            agent_session_file_count = $sessions.Count
            agent_session_files = $sessionNames
            first_stdout_tail = TailText (Join-Path $env:DIAG_EVIDENCE_DIR 'first.stdout.log') 160
            first_stderr_tail = TailText (Join-Path $env:DIAG_EVIDENCE_DIR 'first.stderr.log') 200
            headless_log_tail = TailText (Join-Path $novel 'headless.log') 200
            latest_agent_session_tail = $sessionTail
            file_inventory = $fileInventory
          }
          $diagPath = Join-Path $env:DIAG_EVIDENCE_DIR 'g05-5-timeout-runtime-snapshot.json'
          $diag | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $diagPath -Encoding UTF8
          Write-Host "DIAGNOSTIC SNAPSHOT CAPTURED: $diagPath"
          if ($null -ne $smokeError) { throw "Expected diagnostic reproduction: $smokeError" }

      - name: Upload sanitized timeout runtime snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g05-5-w6c-timeout-diagnostic-${{ env.TARGET_SHA }}
          path: ${{ env.DIAG_EVIDENCE_DIR }}/g05-5-timeout-runtime-snapshot.json
          if-no-files-found: error
          retention-days: 7

      - name: Clean diagnostic runtime
        if: always()
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not [string]::IsNullOrWhiteSpace($env:DIAG_RUNTIME_DIR)) {
            Get-CimInstance Win32_Process -Filter "Name='ainovel-cli.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.ExecutablePath -and ([string]$_.ExecutablePath).StartsWith($env:DIAG_RUNTIME_DIR, [StringComparison]::OrdinalIgnoreCase) } |
              ForEach-Object { try { Stop-Process -Id $_.ProcessId -Force -ErrorAction Stop } catch { } }
          }
          foreach ($path in @($env:DIAG_RUNTIME_DIR, $env:DIAG_INPUT_DIR, $env:DIAG_EVIDENCE_DIR)) {
            if (-not [string]::IsNullOrWhiteSpace($path) -and (Test-Path -LiteralPath $path)) { Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue }
          }

      - name: Restore local config exactly
        if: always()
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          if ([string]::IsNullOrWhiteSpace($env:DIAG_LOCAL_CONFIG_PATH)) { exit 0 }
          if ($env:DIAG_LOCAL_CONFIG_HAD_ORIGINAL -eq 'True') {
            if (Test-Path -LiteralPath $env:DIAG_LOCAL_CONFIG_BACKUP) {
              Copy-Item -LiteralPath $env:DIAG_LOCAL_CONFIG_BACKUP -Destination $env:DIAG_LOCAL_CONFIG_PATH -Force
              Remove-Item -LiteralPath $env:DIAG_LOCAL_CONFIG_BACKUP -Force -ErrorAction SilentlyContinue
              Write-Host 'Original local config restored exactly.'
            } else {
              Write-Error 'Expected diagnostic config backup is missing.'
              exit 1
            }
          } else {
            Remove-Item -LiteralPath $env:DIAG_LOCAL_CONFIG_PATH -Force -ErrorAction SilentlyContinue
          }
