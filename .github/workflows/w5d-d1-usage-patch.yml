name: W5D D1 WEB-only usage patch

on:
  push:
    branches:
      - w5d-cost-update-docs-safety

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[w5d-d1-usage]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w5d-cost-update-docs-safety
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Prepare guarded patcher for remaining audited seams
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/w5d_patch_d1_usage.py')
          s = p.read_text(encoding='utf-8')

          old = 'm = re.search(r"(?m)^func " + re.escape(name) + r"\\s*\\(", text)'
          new = 'm = re.search(r"(?m)^func(?:\\s+\\([^\\n)]*\\))?\\s+" + re.escape(name) + r"\\s*\\(", text)'
          n = s.count(old)
          if n != 2:
              raise SystemExit(f'expected 2 function matcher sites, got {n}')
          s = s.replace(old, new)

          marker = 'if "h.usage" in host or "UsageTracker" in host or "newUsageTrackedModel" in host:\n'
          if s.count(marker) != 1:
              raise SystemExit('host residue assertion marker mismatch')
          extra = '''host = must_replace(host, '\\tmodel = newUsageTrackedModel(model, "editor", h.usage.Record)\\n', '', "revision usage wrapper")\nhost = must_replace(host, '\\tmodel = newUsageTrackedModel(model, role, h.usage.Record)\\n', '', "import usage wrapper")\n'''
          s = s.replace(marker, extra + marker, 1)

          event_marker = 'events = remove_struct_type(events, "AgentCacheStat")\n'
          if s.count(event_marker) != 1:
              raise SystemExit('AgentCacheStat removal marker mismatch')
          event_extra = '''events = re.sub(r'(?ms)^// AgentCacheStat .*?(?=// AgentContextSnapshot)', '', events)\n'''
          s = s.replace(event_marker, event_marker + event_extra, 1)

          sidebar_old = '"renderCacheSidebar", "renderCacheCategory", "renderCacheAgent", "formatTokensCompact",'
          sidebar_new = '"renderCacheSidebar", "renderCacheCategory", "renderCacheAgent", "renderCacheAgentLine", "colorPercent", "formatTokensCompact",'
          if s.count(sidebar_old) != 1:
              raise SystemExit('cache sidebar helper list marker mismatch')
          s = s.replace(sidebar_old, sidebar_new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply guarded WEB-only usage/pricing refactor
        run: python3 .github/scripts/w5d_patch_d1_usage.py
      - name: Format
        run: gofmt -w $(git ls-files '*.go' --modified --others --exclude-standard)
      - name: Vet
        run: go vet ./...
      - name: Full tests
        run: go test ./...
      - name: Active-source NO-BILLING residue gate
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'internal/models|TotalCostUSD|TotalSavedUSD|BudgetLimitUSD|MissingAssistantUsage|CachePerAgent|CachePerModel|stream_options\.include_usage|cost_usd|saved_usd|max_cost_delta_ratio|CostDeltaRatio|InputTokenDeltaRatio|OutputTokenDeltaRatio' --include='*.go' --include='*.json' internal evals
      - name: Commit verified refactor
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No D1 source changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(w5d): remove API billing and usage telemetry [w5d-d1-usage]'
          git push origin HEAD:w5d-cost-update-docs-safety
