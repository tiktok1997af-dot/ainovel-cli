name: W5.5 bounded cleanup

on:
  push:
    branches:
      - w5.5-repository-no-api-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[w55-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w5.5-repository-no-api-audit
          fetch-depth: 0
      - name: Apply bounded W5.5 cleanup
        run: python3 .github/w55_patch.py
      - name: Format Go files
        run: gofmt -w internal/agents/build.go internal/entry/tui/command_config.go internal/entry/tui/model_update.go internal/host/host.go internal/eval/collect.go
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal docs scripts
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "fix(w5.5): remove active API-era residue [w55-patch]"
          git push origin HEAD:w5.5-repository-no-api-audit
