name: W5E R1 real desktop production execution

on:
  push:
    branches:
      - w5e-r1-desktop-orchestrator

permissions:
  contents: read

concurrency:
  group: w5e-r1-real-desktop
  cancel-in-progress: false

jobs:
  real-desktop-production-smoke:
    name: Real Windows desktop / Gemini production smoke
    runs-on: [self-hosted, Windows, X64, ainovel-w5e-desktop]
    timeout-minutes: 60

    steps:
      - name: Checkout exact W5E candidate
        uses: actions/checkout@v4
        with:
          ref: fd254f1b82c298f7d248d3a612b9f6874bd12d78
          fetch-depth: 0

      - name: Setup Go from exact candidate
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Force Git Bash for subsequent steps
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          $bash = Join-Path $gitBin 'bash.exe'
          if (-not (Test-Path -LiteralPath $bash)) {
            throw 'Git Bash is required but bash.exe was not found under Program Files\Git\bin.'
          }
          [System.IO.File]::AppendAllText(
            $env:GITHUB_PATH,
            "$gitBin`r`n",
            (New-Object System.Text.UTF8Encoding($false))
          )
          Write-Host "Git Bash forced for subsequent steps: $bash"

      - name: Verify exact candidate and interactive desktop session
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'fd254f1b82c298f7d248d3a612b9f6874bd12d78'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "Candidate drift: expected $expected but checked out $actual"
          }

          $runnerSession = (Get-Process -Id $PID).SessionId
          $interactiveExplorer = Get-Process explorer -ErrorAction SilentlyContinue |
            Where-Object { $_.SessionId -eq $runnerSession } |
            Select-Object -First 1
          if ($null -eq $interactiveExplorer) {
            throw 'Runner is not in an interactive Windows desktop session. Start the self-hosted runner with run.cmd from the logged-in desktop session; do not run it as a Windows service.'
          }

          $loggedOnUser = (Get-CimInstance Win32_ComputerSystem).UserName
          if ([string]::IsNullOrWhiteSpace($loggedOnUser)) {
            throw 'No interactive logged-on Windows user detected.'
          }

          foreach ($required in @('go','git','bash')) {
            if (-not (Get-Command $required -ErrorAction SilentlyContinue)) {
              throw "Required command is unavailable on the desktop runner: $required"
            }
          }

          $bashResolved = (Get-Command bash -ErrorAction Stop).Source
          $expectedBash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          if ([IO.Path]::GetFullPath($bashResolved) -ne [IO.Path]::GetFullPath($expectedBash)) {
            throw "bash did not resolve to Git Bash: $bashResolved"
          }

          if (-not (Test-Path -LiteralPath 'scripts/w5e-production-smoke.ps1')) {
            throw 'Exact candidate does not contain scripts/w5e-production-smoke.ps1'
          }

          Write-Host "W5E R1 executor precondition PASS"
          Write-Host "Candidate: $actual"
          Write-Host "Interactive session: $runnerSession"
          Write-Host "Bash: $bashResolved"

      - name: Stage transient WEB-only desktop config
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $userHome = [Environment]::GetFolderPath('UserProfile')
          $configDir = Join-Path $userHome '.ainovel'
          $configPath = Join-Path $configDir 'config.json'
          $backupPath = Join-Path $env:RUNNER_TEMP ("w5e-config-backup-" + $env:GITHUB_RUN_ID + ".json")
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null

          $hadOriginal = Test-Path -LiteralPath $configPath
          $profileName = 'default'
          $browserPath = ''
          $startUrl = ''

          if ($hadOriginal) {
            Copy-Item -LiteralPath $configPath -Destination $backupPath -Force
            try {
              $existing = Get-Content -LiteralPath $configPath -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($null -ne $existing.web) {
                if (-not [string]::IsNullOrWhiteSpace([string]$existing.web.profile_name)) {
                  $profileName = [string]$existing.web.profile_name
                }
                if (-not [string]::IsNullOrWhiteSpace([string]$existing.web.browser_path)) {
                  $browserPath = [string]$existing.web.browser_path
                }
                if (-not [string]::IsNullOrWhiteSpace([string]$existing.web.start_url)) {
                  $startUrl = [string]$existing.web.start_url
                }
              }
            } catch {
              Write-Host 'Existing config could not be parsed; exact bytes are backed up and will be restored after the smoke.'
            }
          } else {
            $profilesDir = Join-Path $configDir 'browser\profiles'
            $defaultProfileDir = Join-Path $profilesDir 'default'
            if (-not (Test-Path -LiteralPath $defaultProfileDir)) {
              $dirs = @(Get-ChildItem -LiteralPath $profilesDir -Directory -ErrorAction SilentlyContinue)
              if ($dirs.Count -eq 1) {
                $profileName = $dirs[0].Name
              }
            }
          }

          $web = [ordered]@{
            enabled = $true
            site = 'gemini-web'
            profile_name = $profileName
          }
          if (-not [string]::IsNullOrWhiteSpace($browserPath)) { $web.browser_path = $browserPath }
          if (-not [string]::IsNullOrWhiteSpace($startUrl)) { $web.start_url = $startUrl }

          $cfg = [ordered]@{
            web = $web
            language = 'vi'
          }
          $json = $cfg | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText(
            $configPath,
            $json + "`r`n",
            (New-Object System.Text.UTF8Encoding($false))
          )

          $envLines = @(
            "W5E_LOCAL_CONFIG_PATH=$configPath",
            "W5E_LOCAL_CONFIG_BACKUP=$backupPath",
            "W5E_LOCAL_CONFIG_HAD_ORIGINAL=$hadOriginal"
          ) -join "`r`n"
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            $envLines + "`r`n",
            (New-Object System.Text.UTF8Encoding($false))
          )

          Write-Host "Transient WEB-only config staged for profile '$profileName'."
          Write-Host "Original config present: $hadOriginal"

      - name: Compare clean unauthenticated profile control
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $configPath = $env:W5E_LOCAL_CONFIG_PATH
          $cfg = Get-Content -LiteralPath $configPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $loggedProfile = [string]$cfg.web.profile_name
          $cleanProfile = "w5e-r1-clean-control-$env:GITHUB_RUN_ID"
          $userHome = [Environment]::GetFolderPath('UserProfile')
          $cleanProfileDir = Join-Path $userHome (".ainovel\browser\profiles\" + $cleanProfile)
          $diagExe = Join-Path $env:RUNNER_TEMP 'ainovel-w5e-readiness-control.exe'
          $diagEvidence = Join-Path $env:RUNNER_TEMP 'w5e-clean-control-evidence.json'

          Remove-Item -LiteralPath $cleanProfileDir -Recurse -Force -ErrorAction SilentlyContinue
          & go build -o $diagExe ./cmd/ainovel-w5e-readiness
          if ($LASTEXITCODE -ne 0) { throw 'Failed to build clean-profile readiness control helper.' }

          $cfg.web.profile_name = $cleanProfile
          $json = $cfg | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText(
            $configPath,
            $json + "`r`n",
            (New-Object System.Text.UTF8Encoding($false))
          )

          $controlExit = 1
          $previousErrorAction = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $controlOutput = @(& $diagExe -timeout 20s -evidence $diagEvidence 2>&1)
            $controlExit = $LASTEXITCODE
            $ErrorActionPreference = $previousErrorAction
            foreach ($line in $controlOutput) {
              Write-Host ("CLEAN-CONTROL: " + [string]$line)
            }
          } finally {
            $ErrorActionPreference = $previousErrorAction
            $cfg.web.profile_name = $loggedProfile
            $restoreJson = $cfg | ConvertTo-Json -Depth 6
            [System.IO.File]::WriteAllText(
              $configPath,
              $restoreJson + "`r`n",
              (New-Object System.Text.UTF8Encoding($false))
            )
            Remove-Item -LiteralPath $cleanProfileDir -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $diagEvidence -Force -ErrorAction SilentlyContinue
          }

          if ($controlExit -eq 0) {
            throw 'Clean unauthenticated profile unexpectedly reached READY; authenticated signal is not selective enough.'
          }
          Write-Host 'Clean-profile control produced expected AUTH_REQUIRED/non-READY and was removed.'

      - name: Run real production desktop smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDir = Join-Path $env:RUNNER_TEMP ("ainovel-w5e-r1-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "W5E_EVIDENCE_DIR=$evidenceDir`r`n",
            (New-Object System.Text.UTF8Encoding($false))
          )

          if ($null -eq (Get-Variable IsWindows -Scope Global -ErrorAction SilentlyContinue)) {
            $global:IsWindows = $true
          }

          & ./scripts/w5e-production-smoke.ps1 `
            -RepoRoot $env:GITHUB_WORKSPACE `
            -EvidenceDir $evidenceDir `
            -ReadinessTimeoutSeconds 60 `
            -FirstChapterTimeoutSeconds 1200 `
            -ResumeTimeoutSeconds 1200

      - name: Validate sanitized W5E authority evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'fd254f1b82c298f7d248d3a612b9f6874bd12d78'
          $path = Join-Path $env:W5E_EVIDENCE_DIR 'w5e-production-smoke-evidence.json'
          if (-not (Test-Path -LiteralPath $path)) {
            throw 'Missing w5e-production-smoke-evidence.json'
          }

          $ev = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$ev.schema -ne 'ainovel-w5e-production-smoke/1') { throw 'Unexpected evidence schema' }
          if ([string]$ev.git_sha -ne $expected) { throw 'Evidence candidate SHA mismatch' }
          if (-not [bool]$ev.first_ready) { throw 'first_ready is not true' }
          if (-not [bool]$ev.restart_ready) { throw 'restart_ready is not true' }
          if (-not [bool]$ev.restart_resume_detected) { throw 'restart_resume_detected is not true' }
          if ([string]$ev.runtime_no_api_marker_scan -ne 'PASS') { throw 'runtime NO-API scan did not pass' }
          if ([string]$ev.w55_static_no_api_gate -ne 'PASS') { throw 'W5.5 static gate did not pass' }
          if ([string]$ev.chapter_1_sha256_before_restart -ne [string]$ev.chapter_1_sha256_after_restart) { throw 'Chapter 1 persistence hash mismatch' }

          $tools = @($ev.observed_local_tools | ForEach-Object { [string]$_ })
          foreach ($requiredTool in @('draft_chapter','commit_chapter')) {
            if ($tools -notcontains $requiredTool) { throw "Missing required local tool evidence: $requiredTool" }
          }

          $completed = @($ev.final_progress.completed_chapters | ForEach-Object { [int]$_ })
          if ($completed -notcontains 1 -or $completed -notcontains 2) { throw 'Final progress does not contain completed chapters 1 and 2' }

          Write-Host 'W5E-R1 REAL DESKTOP PRODUCTION EXECUTION: PASS'
          Write-Host "Authority evidence: $path"

      - name: Upload sanitized authority evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: w5e-r1-production-smoke-evidence
          path: |
            ${{ env.W5E_EVIDENCE_DIR }}/w5e-production-smoke-evidence.json
            ${{ env.W5E_EVIDENCE_DIR }}/w5e-readiness-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Restore local config exactly
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          if ([string]::IsNullOrWhiteSpace($env:W5E_LOCAL_CONFIG_PATH)) {
            Write-Host 'No transient local config was staged.'
            exit 0
          }
          if ($env:W5E_LOCAL_CONFIG_HAD_ORIGINAL -eq 'True') {
            if (Test-Path -LiteralPath $env:W5E_LOCAL_CONFIG_BACKUP) {
              Copy-Item -LiteralPath $env:W5E_LOCAL_CONFIG_BACKUP -Destination $env:W5E_LOCAL_CONFIG_PATH -Force
              Remove-Item -LiteralPath $env:W5E_LOCAL_CONFIG_BACKUP -Force -ErrorAction SilentlyContinue
              Write-Host 'Original local config restored exactly.'
            } else {
              Write-Error 'Expected local config backup is missing.'
              exit 1
            }
          } else {
            Remove-Item -LiteralPath $env:W5E_LOCAL_CONFIG_PATH -Force -ErrorAction SilentlyContinue
            Write-Host 'Transient local config removed; original state restored.'
          }
