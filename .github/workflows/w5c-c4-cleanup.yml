name: W5C C4 cleanup

on:
  push:
    branches:
      - w5c-remove-legacy-api-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w5c-remove-legacy-api-runtime
          fetch-depth: 0
      - name: Remove unused legacy import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('internal/host/host.go')
          s = p.read_text()
          old = '\t"sort"\n'
          if old not in s:
              raise SystemExit('sort import anchor missing')
          p.write_text(s.replace(old, '', 1))
          PY
          gofmt -w internal/host/host.go
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/host/host.go
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(w5c): remove obsolete host sort import'
          git push origin HEAD:w5c-remove-legacy-api-runtime
