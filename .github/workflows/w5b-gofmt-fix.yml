name: W5B gofmt fix

on:
  push:
    branches:
      - w5b-browser-only-setup-tui

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: w5b-browser-only-setup-tui
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Format Go sources
        run: gofmt -w $(find . -name '*.go' -type f)

      - name: Commit formatted sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          git commit -m "style(w5b): gofmt browser-only migration"
          git push origin HEAD:w5b-browser-only-setup-tui
