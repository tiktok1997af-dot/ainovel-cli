name: W5B gofmt fix

on:
  push:
    branches:
      - w5b-browser-only-setup-tui

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: w5b-browser-only-setup-tui
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Repair W5B model-switch syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('internal/entry/tui/command_model.go')
          text = path.read_text()
          old = '''\tif len(s.providers) > 0 {\n\t\ts.providerIdx = 0\n\t\tfor i, candidate := range s.providers {\n\t\t\tif candidate == provider {\n\t\t\t\ts.providerIdx = i\n\t\t\t\tbreak\n\t\t\t}\n\t}\n\ts.syncModels(rt, model)'''
          new = '''\tif len(s.providers) > 0 {\n\t\ts.providerIdx = 0\n\t\tfor i, candidate := range s.providers {\n\t\t\tif candidate == provider {\n\t\t\t\ts.providerIdx = i\n\t\t\t\tbreak\n\t\t\t}\n\t\t}\n\t}\n\ts.syncModels(rt, model)'''
          if old not in text:
              raise SystemExit('expected W5B syntax pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format Go sources
        run: gofmt -w $(find . -name '*.go' -type f)

      - name: Commit repaired and formatted sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          git commit -m "fix(w5b): repair and gofmt browser-only migration"
          git push origin HEAD:w5b-browser-only-setup-tui
