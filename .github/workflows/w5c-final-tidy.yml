name: W5C final dependency tidy

on:
  push:
    branches:
      - w5c-remove-legacy-api-runtime

permissions:
  contents: write

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w5c-remove-legacy-api-runtime
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Remove stale direct dependencies
        run: go mod tidy
      - name: Commit tidy result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add go.mod go.sum
          git diff --cached --quiet && exit 0
          git commit -m 'build(w5c): remove stale LiteLLM direct dependency'
          git push origin HEAD:w5c-remove-legacy-api-runtime
