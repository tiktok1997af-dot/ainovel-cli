name: W5C importer hard-cut patch

on:
  push:
    branches:
      - w5c-remove-legacy-api-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w5c-remove-legacy-api-runtime
          fetch-depth: 0
      - name: Remove importer failover and API registry limit
        shell: python
        run: |
          from pathlib import Path
          p = Path('internal/host/host.go')
          s = p.read_text()
          old = '''\tmodel := h.models.ForRoleWithFailover(role, func(ev bootstrap.FailoverEvent) {\n\t\tslog.Warn("导入 provider 切换", "module", "import", "role", ev.Role,\n\t\t\t"reason", ev.Reason,\n\t\t\t"from", fmt.Sprintf("%s/%s", ev.FromProvider, ev.FromModel),\n\t\t\t"to", fmt.Sprintf("%s/%s", ev.ToProvider, ev.ToModel),\n\t\t\t"err", ev.Err)\n\t})\n'''
          new = '''\tmodel := h.models.ForRole(role)\n'''
          if old not in s:
              raise SystemExit('import failover snippet not found exactly')
          s = s.replace(old, new, 1)
          old2 = '''\t// context / completion 上限：registry 是唯一可信来源（被包装模型的 Info() 不含窗口）。\n\trt.ContextTokens, _ = h.cfg.ResolveContextWindow(provider, name)\n\tif entry, ok := modelreg.DefaultRegistry().Resolve(name); ok {\n\t\trt.MaxOutputTokens = entry.MaxTokens\n\t}\n'''
          new2 = '''\t// Context window remains local/provider-neutral. WEB-only mode has no truthful\n\t// provider max-output registry, so MaxOutputTokens stays zero (unspecified).\n\trt.ContextTokens, _ = h.cfg.ResolveContextWindow(provider, name)\n'''
          if old2 not in s:
              raise SystemExit('model registry snippet not found exactly')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
      - name: Format
        run: gofmt -w internal/host/host.go
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/host/host.go
          git diff --cached --quiet && exit 0
          git commit -m "refactor(w5c): remove importer provider fallback residue"
          git push origin HEAD:w5c-remove-legacy-api-runtime
