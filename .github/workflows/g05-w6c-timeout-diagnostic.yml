name: G05 W6C Timeout Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PRODUCT_SHA: 1b5f677ae6f2434a67d1afd0e8410342440d2b9f

jobs:
  package-exact-parent:
    name: Build exact parent diagnostic input
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact product parent
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify exact product parent and WEB-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          bash scripts/w55-no-api-audit.sh
          test -z "$(git status --porcelain)"

      - name: Build exact-parent GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "v2.18.1"
          args: release --snapshot --clean

      - name: Verify exact snapshot provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/w6a-verify-release-snapshot.py \
            --dist dist \
            --expected-sha "$PRODUCT_SHA" \
            --evidence dist/w6c-snapshot-evidence.json
          test -z "$(git status --porcelain)"

      - name: Build exact-parent readiness verifier
        shell: bash
        env:
          GOWORK: "off"
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist/w6c-helper
          go build -trimpath -buildvcs=true -o dist/w6c-helper/ainovel-w5e-readiness.exe ./cmd/ainovel-w5e-readiness
          test -s dist/w6c-helper/ainovel-w5e-readiness.exe
          test -z "$(git status --porcelain)"

      - name: Upload exact-parent diagnostic input
        uses: actions/upload-artifact@v4
        with:
          name: g05-w6c-diag-input-${{ env.PRODUCT_SHA }}
          retention-days: 3
          if-no-files-found: error
          path: |
            dist/*_Windows_x86_64.zip
            dist/ainovel-cli_checksums.txt
            dist/w6c-snapshot-evidence.json
            dist/w6c-helper/ainovel-w5e-readiness.exe

  diagnostic-desktop:
    name: Diagnose exact parent W6C timeout
    needs: package-exact-parent
    runs-on: [self-hosted, Windows, X64, ainovel-w5e-desktop]
    timeout-minutes: 35
    steps:
      - name: Checkout exact parent scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Download exact-parent diagnostic input
        uses: actions/download-artifact@v4
        with:
          name: g05-w6c-diag-input-${{ env.PRODUCT_SHA }}
          path: ${{ runner.temp }}/g05-w6c-diag-input-${{ github.run_id }}

      - name: Prepare exact-parent diagnostic runtime
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:PRODUCT_SHA) { throw "Product parent drift: $actual" }
          $inputDir = Join-Path $env:RUNNER_TEMP ("g05-w6c-diag-input-" + $env:GITHUB_RUN_ID)
          $evidenceDir = Join-Path $env:RUNNER_TEMP ("g05-w6c-diag-evidence-" + $env:GITHUB_RUN_ID)
          $runtimeDir = Join-Path $env:RUNNER_TEMP ("g05-w6c-diag-runtime-" + $env:GITHUB_RUN_ID)
          foreach ($path in @($evidenceDir, $runtimeDir)) {
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $path | Out-Null
          }
          $archive = @(Get-ChildItem -LiteralPath $inputDir -Filter '*_Windows_x86_64.zip' -File -Recurse)
          $manifest = @(Get-ChildItem -LiteralPath $inputDir -Filter 'ainovel-cli_checksums.txt' -File -Recurse)
          $snapshotFile = @(Get-ChildItem -LiteralPath $inputDir -Filter 'w6c-snapshot-evidence.json' -File -Recurse)
          $helper = @(Get-ChildItem -LiteralPath $inputDir -Filter 'ainovel-w5e-readiness.exe' -File -Recurse)
          if ($archive.Count -ne 1 -or $manifest.Count -ne 1 -or $snapshotFile.Count -ne 1 -or $helper.Count -ne 1) { throw 'Diagnostic input incomplete.' }
          $snapshot = Get-Content -LiteralPath $snapshotFile[0].FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$snapshot.candidate_sha -ne $env:PRODUCT_SHA) { throw 'Snapshot SHA mismatch.' }
          $helperHash = (Get-FileHash -LiteralPath $helper[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $envLines = @(
            "DIAG_INPUT_DIR=$inputDir",
            "DIAG_EVIDENCE_DIR=$evidenceDir",
            "DIAG_RUNTIME_DIR=$runtimeDir",
            "DIAG_ARCHIVE=$($archive[0].FullName)",
            "DIAG_MANIFEST=$($manifest[0].FullName)",
            "DIAG_HELPER=$($helper[0].FullName)",
            "DIAG_HELPER_SHA=$helperHash",
            "DIAG_SNAPSHOT_VERSION=$([string]$snapshot.snapshot_version)"
          ) -join "`r`n"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, $envLines + "`r`n", (New-Object System.Text.UTF8Encoding($false)))

      - name: Stage transient WEB-only config
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $userHome = [Environment]::GetFolderPath('UserProfile')
          $configDir = Join-Path $userHome '.ainovel'
          $configPath = Join-Path $configDir 'config.json'
          $backupPath = Join-Path $env:RUNNER_TEMP ("g05-w6c-diag-config-" + $env:GITHUB_RUN_ID + '.json')
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          $hadOriginal = Test-Path -LiteralPath $configPath
          $profileName = 'default'
          $browserPath = ''
          $startUrl = ''
          if ($hadOriginal) {
            Copy-Item -LiteralPath $configPath -Destination $backupPath -Force
            try {
              $existing = Get-Content -LiteralPath $configPath -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($null -ne $existing.web) {
                if (-not [string]::IsNullOrWhiteSpace([string]$existing.web.profile_name)) { $profileName = [string]$existing.web.profile_name }
                if (-not [string]::IsNullOrWhiteSpace([string]$existing.web.browser_path)) { $browserPath = [string]$existing.web.browser_path }
                if (-not [string]::IsNullOrWhiteSpace([string]$existing.web.start_url)) { $startUrl = [string]$existing.web.start_url }
              }
            } catch { }
          }
          $web = [ordered]@{ enabled = $true; site = 'gemini-web'; profile_name = $profileName }
          if ($browserPath) { $web.browser_path = $browserPath }
          if ($startUrl) { $web.start_url = $startUrl }
          $cfg = [ordered]@{ web = $web; language = 'vi' }
          [System.IO.File]::WriteAllText($configPath, (($cfg | ConvertTo-Json -Depth 6) + "`r`n"), (New-Object System.Text.UTF8Encoding($false)))
          $envLines = @(
            "DIAG_CONFIG_PATH=$configPath",
            "DIAG_CONFIG_BACKUP=$backupPath",
            "DIAG_CONFIG_HAD_ORIGINAL=$hadOriginal"
          ) -join "`r`n"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, $envLines + "`r`n", (New-Object System.Text.UTF8Encoding($false)))

      - name: Reproduce exact-parent production timeout and snapshot state
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          $failureMessage = ''
          try {
            & ./scripts/w6c-release-artifact-smoke.ps1 `
              -RepoRoot $env:GITHUB_WORKSPACE `
              -PackageArchivePath $env:DIAG_ARCHIVE `
              -ChecksumManifestPath $env:DIAG_MANIFEST `
              -ReadinessExe $env:DIAG_HELPER `
              -ExpectedReadinessSha256 $env:DIAG_HELPER_SHA `
              -ExpectedGitSha $env:PRODUCT_SHA `
              -ExpectedSnapshotVersion $env:DIAG_SNAPSHOT_VERSION `
              -EvidenceDir $env:DIAG_EVIDENCE_DIR `
              -RuntimeDir $env:DIAG_RUNTIME_DIR `
              -ReadinessTimeoutSeconds 60 `
              -FirstChapterTimeoutSeconds 1200 `
              -ResumeTimeoutSeconds 1200
          } catch {
            $failed = $true
            $failureMessage = [string]$_.Exception.Message
          }

          function Sanitize([string]$text) {
            if ([string]::IsNullOrEmpty($text)) { return '' }
            $userHome = [Environment]::GetFolderPath('UserProfile')
            if ($userHome) { $text = $text.Replace($userHome, '<USERPROFILE>') }
            $text = [regex]::Replace($text, '(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b', '<redacted-email>')
            $text = [regex]::Replace($text, '(?i)\b(cookie|authorization|bearer|token|password|secret|api[_-]?key)\b\s*[:=]\s*[^\s,;]+', '$1=<redacted>')
            $text = [regex]::Replace($text, '(?i)(https?://[^\s?#]+)(?:\?[^\s#]*)?(?:#[^\s]*)?', '$1')
            if ($text.Length -gt 12000) { $text = $text.Substring($text.Length - 12000) }
            return $text
          }
          function TailFile([string]$path) {
            if (-not (Test-Path -LiteralPath $path)) { return '' }
            return Sanitize ((Get-Content -LiteralPath $path -Tail 120 -ErrorAction SilentlyContinue) -join "`n")
          }
          function JsonState([string]$path, [string[]]$fields) {
            if (-not (Test-Path -LiteralPath $path)) { return $null }
            try {
              $obj = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
              $out = [ordered]@{}
              foreach ($f in $fields) { if ($null -ne $obj.$f) { $out[$f] = $obj.$f } }
              return $out
            } catch { return [ordered]@{ parse_error = (Sanitize $_.Exception.Message) } }
          }

          $novel = Join-Path $env:DIAG_RUNTIME_DIR 'output\novel'
          $meta = Join-Path $novel 'meta'
          $progress = JsonState (Join-Path $meta 'progress.json') @('phase','flow','current_chapter','completed_chapters','pending_rewrites')
          $pending = JsonState (Join-Path $meta 'pending_commit.json') @('chapter','stage','rewrite','rewrite_mode','started_at','updated_at')
          $chapterFiles = @()
          $chapterDir = Join-Path $novel 'chapters'
          if (Test-Path -LiteralPath $chapterDir) {
            $chapterFiles = @(Get-ChildItem -LiteralPath $chapterDir -File -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object { [ordered]@{ name=$_.Name; bytes=$_.Length; sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } })
          }
          $draftFiles = @()
          $draftDir = Join-Path $novel 'drafts'
          if (Test-Path -LiteralPath $draftDir) {
            $draftFiles = @(Get-ChildItem -LiteralPath $draftDir -File -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName | ForEach-Object { [ordered]@{ name=$_.Name; bytes=$_.Length; sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } })
          }
          $sessionDir = Join-Path $meta 'sessions\agents'
          $sessionMarkers = @()
          if (Test-Path -LiteralPath $sessionDir) {
            foreach ($sf in @(Get-ChildItem -LiteralPath $sessionDir -Filter '*.jsonl' -File -ErrorAction SilentlyContinue)) {
              $txt = Get-Content -LiteralPath $sf.FullName -Raw -Encoding UTF8 -ErrorAction SilentlyContinue
              $tools = @('save_foundation','save_book','plan_chapter','draft_chapter','commit_chapter','save_review') | Where-Object { $txt -match [regex]::Escape($_) }
              $sessionMarkers += [ordered]@{ name=$sf.Name; bytes=$sf.Length; observed_tools=@($tools); tail=(Sanitize (($txt -split "`r?`n" | Select-Object -Last 20) -join "`n")) }
            }
          }
          $diag = [ordered]@{
            schema = 'ainovel-g05-w6c-timeout-diagnostic/1'
            product_sha = $env:PRODUCT_SHA
            run_id = [string]$env:GITHUB_RUN_ID
            smoke_failed = $failed
            error = (Sanitize $failureMessage)
            progress = $progress
            pending_commit = $pending
            chapters = $chapterFiles
            drafts = $draftFiles
            session_markers = $sessionMarkers
            first_stdout_tail = TailFile (Join-Path $env:DIAG_EVIDENCE_DIR 'first.stdout.log')
            first_stderr_tail = TailFile (Join-Path $env:DIAG_EVIDENCE_DIR 'first.stderr.log')
            headless_log_tail = TailFile (Join-Path $novel 'headless.log')
            captured_at = (Get-Date).ToUniversalTime().ToString('o')
          }
          $diagPath = Join-Path $env:DIAG_EVIDENCE_DIR 'g05-w6c-timeout-diagnostic.json'
          $diag | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $diagPath -Encoding UTF8
          if (-not $failed) { Write-Host 'Diagnostic reproduction completed without timeout; evidence still captured.' }
          if ($failed) { Write-Host ('Diagnostic reproduced failure: ' + (Sanitize $failureMessage)) }

      - name: Upload sanitized timeout diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g05-w6c-timeout-diagnostic-${{ env.PRODUCT_SHA }}
          path: ${{ env.DIAG_EVIDENCE_DIR }}/g05-w6c-timeout-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup diagnostic runtime
        if: always()
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($path in @($env:DIAG_RUNTIME_DIR, $env:DIAG_INPUT_DIR, $env:DIAG_EVIDENCE_DIR)) {
            if ($path -and (Test-Path -LiteralPath $path)) { Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue }
          }
          if ($env:DIAG_CONFIG_HAD_ORIGINAL -eq 'True' -and (Test-Path -LiteralPath $env:DIAG_CONFIG_BACKUP)) {
            Copy-Item -LiteralPath $env:DIAG_CONFIG_BACKUP -Destination $env:DIAG_CONFIG_PATH -Force
            Remove-Item -LiteralPath $env:DIAG_CONFIG_BACKUP -Force -ErrorAction SilentlyContinue
          } elseif ($env:DIAG_CONFIG_PATH) {
            Remove-Item -LiteralPath $env:DIAG_CONFIG_PATH -Force -ErrorAction SilentlyContinue
          }
