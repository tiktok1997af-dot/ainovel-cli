name: W5A guarded migration

on:
  push:
    branches:
      - w5-web-only-integration-api-removal
    paths:
      - .github/workflows/w5a-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w5-web-only-integration-api-removal
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Apply guarded W5A patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          def lines(items):
              return "\n".join(items) + "\n"

          p = Path("internal/bootstrap/config.go")
          s = p.read_text()
          marker = "// ProviderConfig 定义单个 LLM 提供商的凭证。\n"
          block = lines([
              "// WebAIConfig defines the browser-owned AI runtime. No credential is stored here.",
              "// W5A initially supports Gemini Web only; additional websites require a verified adapter.",
              "type WebAIConfig struct {",
              "\tEnabled     bool   `json:\"enabled,omitempty\"`",
              "\tSite        string `json:\"site,omitempty\"`",
              "\tBrowserPath string `json:\"browser_path,omitempty\"`",
              "\tProfileName string `json:\"profile_name,omitempty\"`",
              "\tStartURL    string `json:\"start_url,omitempty\"`",
              "}",
              "",
              "func (w *WebAIConfig) fillDefaults() {",
              "\tif strings.TrimSpace(w.Site) == \"\" {",
              "\t\tw.Site = \"gemini-web\"",
              "\t}",
              "\tif strings.TrimSpace(w.ProfileName) == \"\" {",
              "\t\tw.ProfileName = \"default\"",
              "\t}",
              "}",
              "",
          ])
          s = once(s, marker, block + marker, "WebAIConfig")
          old = lines([
              "\t// 默认 LLM 配置",
              "\tProvider  string `json:\"provider\"` // 默认 provider（Providers map 中的 key）",
              "\tModelName string `json:\"model\"`    // 默认模型名",
          ])
          new = lines([
              "\t// WEB-only browser runtime. When enabled, no provider/API credential path is constructed.",
              "\tWeb WebAIConfig `json:\"web,omitzero\"`",
              "",
              "\t// Legacy API-era identity fields remain only while W5B/W5C migrate old configs/UI.",
              "\tProvider  string `json:\"provider,omitempty\"`",
              "\tModelName string `json:\"model,omitempty\"`",
          ])
          s = once(s, old, new, "Config Web field")
          old = "// ValidateBase 校验基础配置。\nfunc (c *Config) ValidateBase() error {\n"
          new = old + "\tif c.Web.Enabled {\n\t\treturn c.validateWebOnly()\n\t}\n"
          s = once(s, old, new, "ValidateBase web branch")
          marker = "func validateProviderConfigText(name string, pc ProviderConfig) error {"
          block = lines([
              "func (c *Config) validateWebOnly() error {",
              "\tc.Web.fillDefaults()",
              "\tsite := strings.ToLower(strings.TrimSpace(c.Web.Site))",
              "\tif site != \"gemini-web\" && site != \"gemini\" {",
              "\t\treturn fmt.Errorf(\"web.site %q is not supported; W5 currently supports gemini-web only: %w\", c.Web.Site, errs.ErrConfig)",
              "\t}",
              "\tfields := []struct { name, value string }{",
              "\t\t{\"web.site\", c.Web.Site},",
              "\t\t{\"web.browser_path\", c.Web.BrowserPath},",
              "\t\t{\"web.profile_name\", c.Web.ProfileName},",
              "\t\t{\"web.start_url\", c.Web.StartURL},",
              "\t}",
              "\tfor _, field := range fields {",
              "\t\tif err := validateConfigText(field.name, field.value); err != nil { return err }",
              "\t}",
              "\tprofile := strings.TrimSpace(c.Web.ProfileName)",
              "\tif profile == \".\" || profile == \"..\" || strings.ContainsAny(profile, `/\\\\`) {",
              "\t\treturn fmt.Errorf(\"web.profile_name %q is invalid: %w\", c.Web.ProfileName, errs.ErrConfig)",
              "\t}",
              "\tif c.Provider != \"\" && c.Provider != \"web\" {",
              "\t\treturn fmt.Errorf(\"legacy API provider %q cannot be used with web.enabled=true; remove provider/providers/api_key/base_url: %w\", c.Provider, errs.ErrConfig)",
              "\t}",
              "\tif c.ModelName != \"\" && c.ModelName != \"gemini-web\" {",
              "\t\treturn fmt.Errorf(\"legacy API model %q cannot be used with web.enabled=true; remove provider/model API routing: %w\", c.ModelName, errs.ErrConfig)",
              "\t}",
              "\tif len(c.Providers) != 0 {",
              "\t\treturn fmt.Errorf(\"legacy API providers are forbidden when web.enabled=true; remove providers/api_key/base_url: %w\", errs.ErrConfig)",
              "\t}",
              "\tfor role, rc := range c.Roles {",
              "\t\tif !knownRoles[role] { return fmt.Errorf(\"unknown role %q in roles config: %w\", role, errs.ErrConfig) }",
              "\t\tif strings.TrimSpace(rc.Provider) != \"\" || strings.TrimSpace(rc.Model) != \"\" || len(rc.Fallbacks) != 0 {",
              "\t\t\treturn fmt.Errorf(\"role %q contains legacy provider/model/fallback routing; WEB-only mode uses one browser session for all roles: %w\", role, errs.ErrConfig)",
              "\t\t}",
              "\t}",
              "\tif c.Budget.BookUSD < 0 { return fmt.Errorf(\"budget.book_usd must be >= 0: %w\", errs.ErrConfig) }",
              "\tif c.Budget.Enabled() && (c.Budget.WarnRatio <= 0 || c.Budget.WarnRatio >= 1) {",
              "\t\treturn fmt.Errorf(\"budget.warn_ratio must be in (0, 1): %w\", errs.ErrConfig)",
              "\t}",
              "\tif err := validateConfigText(\"notify.command\", c.Notify.Command); err != nil { return err }",
              "\tfor _, ev := range c.Notify.Events {",
              "\t\tif !notify.IsKnownKind(ev) { return fmt.Errorf(\"unknown notify event %q (valid: %s): %w\", ev, strings.Join(notify.Kinds(), \"/\"), errs.ErrConfig) }",
              "\t}",
              "\treturn nil",
              "}",
              "",
          ])
          s = once(s, marker, block + marker, "validateWebOnly")
          old = "func (c *Config) FillDefaults() {\n\tif c.OutputDir == \"\" {\n\t\tc.OutputDir = filepath.Join(\"output\", \"novel\")\n\t}\n"
          new = old + "\tif c.Web.Enabled {\n\t\tc.Web.fillDefaults()\n\t\tif strings.TrimSpace(c.Provider) == \"\" { c.Provider = \"web\" }\n\t\tif strings.TrimSpace(c.ModelName) == \"\" { c.ModelName = \"gemini-web\" }\n\t}\n"
          s = once(s, old, new, "FillDefaults web")
          old = "func (c Config) ResolveContextWindow(provider, modelName string) (int, ContextWindowSource) {\n\tif pc, ok := c.Providers[strings.TrimSpace(provider)]; ok {\n"
          new = "func (c Config) ResolveContextWindow(provider, modelName string) (int, ContextWindowSource) {\n\tif c.Web.Enabled {\n\t\tif c.ContextWindow > 0 { return c.ContextWindow, CtxWindowConfig }\n\t\treturn DefaultContextWindow, CtxWindowDefault\n\t}\n\tif pc, ok := c.Providers[strings.TrimSpace(provider)]; ok {\n"
          s = once(s, old, new, "ResolveContextWindow web")
          old = "func (c Config) CandidateModels(provider string) []string {\n\tif provider == \"\" {\n"
          new = "func (c Config) CandidateModels(provider string) []string {\n\tif c.Web.Enabled {\n\t\tif provider == \"\" || provider == \"web\" { return []string{\"gemini-web\"} }\n\t\treturn nil\n\t}\n\tif provider == \"\" {\n"
          s = once(s, old, new, "CandidateModels web")
          p.write_text(s)

          p = Path("internal/bootstrap/models.go")
          s = p.read_text()
          s = once(s, "\t\"github.com/voocel/ainovel-cli/internal/llmcontract\"\n)\n", "\t\"github.com/voocel/ainovel-cli/internal/llmcontract\"\n\t\"github.com/voocel/ainovel-cli/internal/webai\"\n)\n", "models import webai")
          s = once(s, "\tfallbacks map[string][]modelTarget\n\tconfig    Config\n}\n", "\tfallbacks map[string][]modelTarget\n\tconfig    Config\n\twebOnly   bool\n}\n", "ModelSet webOnly")
          old = "func (ms *ModelSet) Swap(role, provider, model string) error {\n\tms.mu.Lock()\n\tdefer ms.mu.Unlock()\n"
          new = old + "\tif ms.webOnly {\n\t\treturn fmt.Errorf(\"WEB-only runtime uses the logged-in browser session and does not support provider/API model switching: %w\", errs.ErrConfig)\n\t}\n"
          s = once(s, old, new, "Swap guard")
          s = once(s, "\tms.fallbacks = candidate.fallbacks\n\tms.config = CloneConfig(candidate.config)\n}\n", "\tms.fallbacks = candidate.fallbacks\n\tms.config = CloneConfig(candidate.config)\n\tms.webOnly = candidate.webOnly\n}\n", "ApplyPrepared webOnly")
          old = "func NewModelSet(cfg Config) (*ModelSet, error) {\n\tcache := make(map[string]agentcore.ChatModel)\n"
          new = "func NewModelSet(cfg Config) (*ModelSet, error) {\n\tif cfg.Web.Enabled {\n\t\treturn nil, fmt.Errorf(\"WEB-only config must use NewWebModelSet; refusing legacy API constructor: %w\", errs.ErrConfig)\n\t}\n\tcache := make(map[string]agentcore.ChatModel)\n"
          s = once(s, old, new, "NewModelSet guard")
          marker = "// createModelFromConfig 创建或复用 ChatModel 实例。\n"
          block = lines([
              "// NewWebModelSet builds the production WEB-only model graph over one owned browser session.",
              "// Architect/Writer/Editor/Arbiter share this browser transport; there is no provider fallback.",
              "func NewWebModelSet(cfg Config, session *webai.SessionManager) (*ModelSet, error) {",
              "\tif !cfg.Web.Enabled { return nil, fmt.Errorf(\"web runtime is not enabled: %w\", errs.ErrConfig) }",
              "\tif session == nil { return nil, fmt.Errorf(\"WEB-only model set requires a browser session: %w\", errs.ErrConfig) }",
              "\ttransport, err := webai.NewGeminiWebTransport(webai.GeminiWebTransportConfig{Session: session})",
              "\tif err != nil { return nil, fmt.Errorf(\"create Gemini Web transport: %w\", err) }",
              "\tmodel, err := webai.NewModel(webai.ModelConfig{Site: \"gemini-web\", Model: \"gemini-web\", Transport: transport})",
              "\tif err != nil { return nil, fmt.Errorf(\"create WEB ChatModel: %w\", err) }",
              "\treturn &ModelSet{",
              "\t\tDefault: NewSwappableModel(\"web\", \"gemini-web\", model, nil),",
              "\t\tmodels: make(map[string]*SwappableModel),",
              "\t\tfallbacks: make(map[string][]modelTarget),",
              "\t\tconfig: cfg,",
              "\t\twebOnly: true,",
              "\t}, nil",
              "}",
              "",
          ])
          s = once(s, marker, block + marker, "NewWebModelSet")
          p.write_text(s)

          p = Path("internal/host/host.go")
          s = p.read_text()
          s = once(s, "\t\"github.com/voocel/ainovel-cli/internal/userrules\"\n)\n", "\t\"github.com/voocel/ainovel-cli/internal/userrules\"\n\t\"github.com/voocel/ainovel-cli/internal/webai\"\n)\n", "host import webai")
          s = once(s, "\tmodels          *bootstrap.ModelSet\n\tengine          *engine\n", "\tmodels          *bootstrap.ModelSet\n\twebSession      *webai.SessionManager\n\tengine          *engine\n", "Host webSession field")
          s = once(s, "\tkeepBookLease := false\n\tvar logCleanup func()\n\tdefer func() {\n", "\tkeepBookLease := false\n\tvar logCleanup func()\n\tvar webSession *webai.SessionManager\n\tdefer func() {\n", "Host web cleanup var")
          s = once(s, "\t\tif logCleanup != nil {\n\t\t\tlogCleanup()\n\t\t}\n\t}()\n", "\t\tif webSession != nil { _ = webSession.Stop() }\n\t\tif logCleanup != nil {\n\t\t\tlogCleanup()\n\t\t}\n\t}()\n", "Host constructor cleanup")
          s = once(s, "\t// 起后台 goroutine 从 OpenRouter 刷新模型元数据（窗口/价格），磁盘缓存 24h。\n\tmodelreg.StartPricingRefresh(modelreg.DefaultRegistry(), bootstrap.DefaultConfigDir())\n", "\t// API-era pricing metadata is never refreshed in WEB-only mode.\n\tif !cfg.Web.Enabled {\n\t\tmodelreg.StartPricingRefresh(modelreg.DefaultRegistry(), bootstrap.DefaultConfigDir())\n\t}\n", "disable pricing refresh")
          s = once(s, "\tmodels, err := bootstrap.NewModelSet(cfg)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"create models: %w\", err)\n\t}\n", "\tvar models *bootstrap.ModelSet\n\tif cfg.Web.Enabled {\n\t\twebSession, models, err = startWebRuntime(context.Background(), cfg, nil)\n\t} else {\n\t\tmodels, err = bootstrap.NewModelSet(cfg)\n\t}\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"create models: %w\", err)\n\t}\n", "Host web model boot")
          s = once(s, "\t\tmodels:          models,\n\t\tthinkingApplier: applyThinking,\n", "\t\tmodels:          models,\n\t\twebSession:      webSession,\n\t\tthinkingApplier: applyThinking,\n", "Host assign session")
          s = once(s, "\t\th.engine.abort()\n\t\th.engine.wait()\n\t\th.asyncWG.Wait()\n\n\t\tif h.usageCancel != nil {\n", "\t\th.engine.abort()\n\t\th.engine.wait()\n\t\th.asyncWG.Wait()\n\t\tif h.webSession != nil {\n\t\t\tif err := h.webSession.Stop(); err != nil { slog.Warn(\"WEB browser session stop failed\", \"module\", \"webai\", \"err\", err) }\n\t\t\th.webSession = nil\n\t\t}\n\n\t\tif h.usageCancel != nil {\n", "Host Close session")
          p.write_text(s)
          PY
      - name: Format
        run: gofmt -w internal/bootstrap/config.go internal/bootstrap/models.go internal/host/host.go internal/host/web_runtime.go internal/bootstrap/web_config_test.go internal/bootstrap/web_models_test.go internal/host/web_runtime_test.go
      - name: Guarded tests
        run: go test -buildvcs=false -count=1 ./internal/bootstrap ./internal/webai ./internal/host
      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/bootstrap/config.go internal/bootstrap/models.go internal/host/host.go internal/host/web_runtime.go internal/bootstrap/web_config_test.go internal/bootstrap/web_models_test.go internal/host/web_runtime_test.go
          git diff --cached --check
          git commit -m 'feat(webai): wire browser runtime into production bootstrap'
          git push origin HEAD:w5-web-only-integration-api-removal
