name: W5C final residue audit

on:
  push:
    branches:
      - w5c-remove-legacy-api-runtime

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w5c-remove-legacy-api-runtime
          fetch-depth: 0

      - name: Hard forbidden active API runtime
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          check_absent() {
            label="$1"
            pattern="$2"
            echo "=== $label ==="
            if grep -RInE --include='*.go' --exclude='*_test.go' "$pattern" internal cmd; then
              echo "HARD_FAIL: $label"
              fail=1
            else
              echo "PASS: absent"
            fi
          }
          check_absent 'direct LiteLLM production import' 'github\.com/voocel/litellm'
          check_absent 'API model constructors/options' 'llm\.NewModel|WithAPIKey|WithBaseURL|WithProviderExtra|WithExtra'
          check_absent 'provider failover/hot-swap constructors' 'ForRoleWithFailover|FailoverEvent|NewModelSet|ProviderPresets|ProviderConfig'
          check_absent 'credential-bearing production symbols' '\bAPIKey\b|\bBaseURL\b|SaveProviderConfig'
          direct_litellm="$(grep -nE '^[[:space:]]*github\.com/voocel/litellm([[:space:]]|$)' go.mod | grep -v '// indirect' || true)"
          if [ -n "$direct_litellm" ]; then
            echo "$direct_litellm"
            echo 'HARD_FAIL: direct litellm dependency remains in go.mod'
            fail=1
          else
            echo 'PASS: no direct litellm dependency in go.mod'
            grep -n 'github.com/voocel/litellm' go.mod || echo 'INFO: no transitive litellm line either'
          fi
          exit "$fail"

      - name: Persisted schema credential fields
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          echo '=== JSON schema tags forbidden in production ==='
          for pattern in 'json:"api_key' 'json:"base_url' 'json:"providers' 'json:"fallbacks'; do
            if grep -RIn --include='*.go' --exclude='*_test.go' "$pattern" internal cmd; then
              echo "HARD_FAIL: persisted API-era schema tag: $pattern"
              fail=1
            fi
          done
          if [ "$fail" -eq 0 ]; then
            echo 'PASS: no persisted API credential/provider/fallback schema tags'
          fi
          exit "$fail"

      - name: Migration detectors and soft references
        shell: bash
        run: |
          set +e
          echo '=== ALLOWED: migration detector / guidance references ==='
          grep -RIn --include='*.go' --exclude='*_test.go' -E 'LegacyAPIMigrationHint|forbiddenLegacy|api_key|base_url|providers|fallbacks' internal/bootstrap || true
          echo '=== SOFT: ollama/openrouter/api vendor references in production Go ==='
          grep -RIn --include='*.go' --exclude='*_test.go' -Ei 'ollama|openrouter|anthropic|openai|gemini api' internal cmd || true
          echo '=== SOFT: model registry/pricing production callers ==='
          grep -RIn --include='*.go' --exclude='*_test.go' -E 'internal/models|StartPricingRefresh|DefaultRegistry|ResolveContextWindow' internal cmd || true
          echo '=== SOFT: generic provider/model metadata terms ==='
          grep -RIn --include='*.go' --exclude='*_test.go' -E 'provider/model|ProviderName\(|ModelProvider\(' internal cmd || true

      - name: Temporary W5 files must be absent
        shell: bash
        run: |
          set -euo pipefail
          found="$(find .github -maxdepth 2 -type f \( -name 'w5c-*patch*' -o -name 'w5c-*cleanup*' -o -name 'w5c-*tidy*' -o -name 'w5c_c*_patch.py' \) -print)"
          if [ -n "$found" ]; then
            echo "$found"
            echo 'HARD_FAIL: temporary W5 patch/cleanup/tidy files remain'
            exit 1
          fi
          echo 'PASS: no temporary W5 patch/cleanup/tidy files'
