name: W5C C3 source patch

on:
  push:
    branches:
      - w5c-remove-legacy-api-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w5c-remove-legacy-api-runtime
          fetch-depth: 0
      - name: Apply source patch
        run: |
          python .github/w5c_c3_patch.py
          gofmt -w internal/bootstrap/config.go internal/bootstrap/configfile.go
      - name: Commit source patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/bootstrap/config.go internal/bootstrap/configfile.go
          git diff --cached --quiet && exit 0
          git commit -m "feat(w5c): enforce WEB-only config migration contract"
          git push origin HEAD:w5c-remove-legacy-api-runtime
