name: W6E v0.1.4 Live Publisher

on:
  push:
    branches:
      - w6e-v0.1.4-prepublication
      - w6e-v0.1.4-publication-authority

permissions:
  contents: write

env:
  PRODUCT_REPOSITORY: tiktok1997af-dot/ainovel-cli
  RELEASE_TAG: v0.1.4
  RELEASE_VERSION: 0.1.4
  PREVIOUS_RELEASE_TAG: v0.1.3
  LOCKED_FINAL_SHA: 95ffc80a90f8bf4a014c70ea7cc8bf47c51df31e
  AUTHORITY_BRANCH: w6e-v0.1.4-publication-authority
  AUTHORITY_MESSAGE: release(w6e): authorize v0.1.4 from frozen 95ffc80a

jobs:
  dry-contract:
    name: Publisher dry contract
    if: ${{ github.ref == 'refs/heads/w6e-v0.1.4-prepublication' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live publisher remains inert on prepublication branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -Fq "w6e-v0.1.4-publication-authority" .github/workflows/w6e-v014-publish.yml
          grep -Fq "release(w6e): authorize v0.1.4 from frozen 95ffc80a" .github/workflows/w6e-v014-publish.yml
          grep -Fq "LOCKED_FINAL_SHA: 95ffc80a90f8bf4a014c70ea7cc8bf47c51df31e" .github/workflows/w6e-v014-publish.yml
          grep -Fq "RELEASE_TAG: v0.1.4" .github/workflows/w6e-v014-publish.yml
          test -z "$(git ls-remote --tags origin refs/tags/$RELEASE_TAG)"
          if gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::target release already exists before live authorization"
            exit 1
          fi
          echo 'W6E publisher dry contract PASS; no live publication executed.'

  publication-preflight:
    name: Exact frozen SHA publication preflight
    if: >-
      ${{ github.ref == 'refs/heads/w6e-v0.1.4-publication-authority' &&
          github.event.head_commit.message == 'release(w6e): authorize v0.1.4 from frozen 95ffc80a' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify bounded publication-control diff and release state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$LOCKED_FINAL_SHA" HEAD
          python3 - <<'PY'
          import os, subprocess
          locked=os.environ['LOCKED_FINAL_SHA']
          changed=set(subprocess.check_output(['git','diff','--name-only',f'{locked}..HEAD'],text=True).splitlines())
          allowed={
            '.github/workflows/w6e-v014-prepublication.yml',
            '.github/workflows/w6e-v014-publish.yml',
            'docs/w6e-v0.1.4-live-publication-authority.md',
          }
          required={'.github/workflows/w6e-v014-prepublication.yml','.github/workflows/w6e-v014-publish.yml','docs/w6e-v0.1.4-live-publication-authority.md'}
          extra=changed-allowed; missing=required-changed
          if extra or missing:
              raise SystemExit(f'bounded publication diff failed; changed={sorted(changed)} extra={sorted(extra)} missing={sorted(missing)}')
          print('W6E bounded publication-control diff PASS')
          PY
          test -n "$(git ls-remote --tags origin refs/tags/$PREVIOUS_RELEASE_TAG)"
          ref="$(git ls-remote --tags origin refs/tags/$RELEASE_TAG)"
          if [ -n "$ref" ]; then
            test "$ref" = "$LOCKED_FINAL_SHA	refs/tags/$RELEASE_TAG"
          fi
          gh release view "$PREVIOUS_RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null
          if gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1 && [ -z "$ref" ]; then
            echo "::error::target release exists without exact target tag"
            exit 1
          fi
      - name: Checkout exact frozen product authority
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$LOCKED_FINAL_SHA"
          test "$(git rev-parse HEAD)" = "$LOCKED_FINAL_SHA"
          test -z "$(git status --porcelain)"
      - name: Re-prove WEB-only product authority
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/w55-no-api-audit.sh
          go test ./...
          go test ./internal/version
          sh .github/scripts/gen-changelog.sh > /tmp/a.md
          sh .github/scripts/gen-changelog.sh > /tmp/b.md
          cmp /tmp/a.md /tmp/b.md
      - name: Final non-publishing packaging proof
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "v2.18.1"
          args: release --snapshot --clean
      - name: Verify final snapshot is frozen SHA
        shell: bash
        run: python3 scripts/w6a-verify-release-snapshot.py --dist dist --expected-sha "$LOCKED_FINAL_SHA" --evidence dist/w6e-final-prepublish.json

  publish:
    name: Publish v0.1.4 from exact frozen SHA
    needs: publication-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 95ffc80a90f8bf4a014c70ea7cc8bf47c51df31e
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Create exact release tag or verify exact recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LOCKED_FINAL_SHA"
          ref="$(git ls-remote --tags origin refs/tags/$RELEASE_TAG)"
          if [ -z "$ref" ]; then
            if gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::target release exists before target tag"
              exit 1
            fi
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag "$RELEASE_TAG" "$LOCKED_FINAL_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          else
            test "$ref" = "$LOCKED_FINAL_SHA	refs/tags/$RELEASE_TAG"
            git tag "$RELEASE_TAG" "$LOCKED_FINAL_SHA" 2>/dev/null || true
          fi
          test "$(git ls-remote --tags origin refs/tags/$RELEASE_TAG)" = "$LOCKED_FINAL_SHA	refs/tags/$RELEASE_TAG"
      - name: Generate deterministic official release notes
        shell: bash
        run: sh .github/scripts/gen-changelog.sh > release-notes.md
      - name: Detect exact recovery release state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1; then echo 'exists=true' >> "$GITHUB_OUTPUT"; else echo 'exists=false' >> "$GITHUB_OUTPUT"; fi
      - name: Publish with fork-owned GoReleaser
        if: ${{ steps.state.outputs.exists != 'true' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "v2.18.1"
          args: release --clean --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify live release and install paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published dist/w6e-evidence
          gh api "repos/$PRODUCT_REPOSITORY/releases/tags/$RELEASE_TAG" > /tmp/release.json
          gh release download "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --dir published
          python3 scripts/w6d-verify-published-release.py --release-json /tmp/release.json --assets-dir published --expected-tag "$RELEASE_TAG" --expected-sha "$LOCKED_FINAL_SHA" --output dist/w6e-evidence/w6e-published-release.json
          p="$RUNNER_TEMP/pinned"; l="$RUNNER_TEMP/latest"; mkdir -p "$p" "$l"
          AINOVEL_INSTALL_DIR="$p" AINOVEL_VERSION="$RELEASE_TAG" sh scripts/install.sh
          AINOVEL_INSTALL_DIR="$l" AINOVEL_VERSION=latest sh scripts/install.sh
          for exe in "$p/ainovel-cli" "$l/ainovel-cli"; do
            out="$($exe --version)"
            printf '%s\n' "$out" | grep -Fq "ainovel-cli $RELEASE_TAG"
            printf '%s\n' "$out" | grep -Fq "commit: $LOCKED_FINAL_SHA"
          done
      - name: Build Windows readiness helper outside release assets
        shell: bash
        env:
          GOWORK: "off"
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/w6e-helper
          go build -trimpath -buildvcs=true -o dist/w6e-helper/ainovel-w5e-readiness.exe ./cmd/ainovel-w5e-readiness
      - uses: actions/upload-artifact@v4
        with:
          name: ainovel-w6e-published-release-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/w6e-evidence/*.json
            release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: ainovel-w6e-readiness-helper-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: dist/w6e-helper/ainovel-w5e-readiness.exe

  desktop:
    name: Real Windows desktop / live published v0.1.4
    needs: publish
    runs-on: [self-hosted, Windows, X64, ainovel-w5e-desktop]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 95ffc80a90f8bf4a014c70ea7cc8bf47c51df31e
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ainovel-w6e-readiness-helper-${{ github.sha }}
          path: ${{ runner.temp }}/w6e-helper-${{ github.run_id }}
      - name: Stage live Windows asset and transient WEB-only config
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:RUNNER_TEMP ("w6e-"+$env:GITHUB_RUN_ID);$input=Join-Path $base 'input';$evidence=Join-Path $base 'evidence';$runtime=Join-Path $base 'runtime';foreach($p in @($base,$input,$evidence,$runtime)){New-Item -ItemType Directory -Force -Path $p|Out-Null}
          $archive=Join-Path $input ("ainovel-cli_"+$env:RELEASE_VERSION+"_Windows_x86_64.zip");$checksums=Join-Path $input 'ainovel-cli_checksums.txt';$url="https://github.com/$($env:PRODUCT_REPOSITORY)/releases/download/$($env:RELEASE_TAG)"
          & curl.exe -fL --proto '=https' --proto-redir '=https' --tlsv1.2 -o $archive "$url/ainovel-cli_$($env:RELEASE_VERSION)_Windows_x86_64.zip";if($LASTEXITCODE-ne 0){throw 'live archive download failed'}
          & curl.exe -fL --proto '=https' --proto-redir '=https' --tlsv1.2 -o $checksums "$url/ainovel-cli_checksums.txt";if($LASTEXITCODE-ne 0){throw 'live checksum download failed'}
          $helper=@(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP ("w6e-helper-"+$env:GITHUB_RUN_ID)) -Filter 'ainovel-w5e-readiness.exe' -File -Recurse);if($helper.Count-ne 1){throw 'helper ambiguity'};$hash=(Get-FileHash $helper[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $session=(Get-Process -Id $PID).SessionId;if($null-eq (Get-Process explorer -ErrorAction SilentlyContinue|Where-Object{$_.SessionId-eq $session}|Select-Object -First 1)){throw 'non-interactive desktop'}
          $home=[Environment]::GetFolderPath('UserProfile');$dir=Join-Path $home '.ainovel';$cfg=Join-Path $dir 'config.json';$bak=Join-Path $env:RUNNER_TEMP ("w6e-config-"+$env:GITHUB_RUN_ID+'.bak');New-Item -ItemType Directory -Force -Path $dir|Out-Null;$had=Test-Path $cfg;$profile='default';$browser='';$start=''
          if($had){Copy-Item $cfg $bak -Force;try{$old=Get-Content $cfg -Raw -Encoding UTF8|ConvertFrom-Json;if($old.web){if($old.web.profile_name){$profile=[string]$old.web.profile_name};if($old.web.browser_path){$browser=[string]$old.web.browser_path};if($old.web.start_url){$start=[string]$old.web.start_url}}}catch{}}
          $web=[ordered]@{enabled=$true;site='gemini-web';profile_name=$profile};if($browser){$web.browser_path=$browser};if($start){$web.start_url=$start};[IO.File]::WriteAllText($cfg,(([ordered]@{web=$web;language='vi'}|ConvertTo-Json -Depth 6)+"`r`n"),(New-Object Text.UTF8Encoding($false)))
          @("W6E_BASE=$base","W6E_ARCHIVE=$archive","W6E_CHECKSUMS=$checksums","W6E_EVIDENCE=$evidence","W6E_RUNTIME=$runtime","W6E_HELPER=$($helper[0].FullName)","W6E_HELPER_HASH=$hash","W6E_CFG=$cfg","W6E_BAK=$bak","W6E_HAD=$had")|ForEach-Object{[IO.File]::AppendAllText($env:GITHUB_ENV,$_+"`r`n",(New-Object Text.UTF8Encoding($false)))}
      - name: Run live published Windows WEB-only authority
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';if((git rev-parse HEAD).Trim().ToLowerInvariant()-ne $env:LOCKED_FINAL_SHA){throw 'candidate drift'}
          & ./scripts/w6d-published-windows-smoke.ps1 -RepoRoot $env:GITHUB_WORKSPACE -PackageArchivePath $env:W6E_ARCHIVE -ChecksumManifestPath $env:W6E_CHECKSUMS -ReadinessExe $env:W6E_HELPER -ExpectedReadinessSha256 $env:W6E_HELPER_HASH -ExpectedGitSha $env:LOCKED_FINAL_SHA -ReleaseTag $env:RELEASE_TAG -EvidenceDir $env:W6E_EVIDENCE -RuntimeDir $env:W6E_RUNTIME
      - name: Validate live desktop evidence
        shell: powershell
        run: |
          $ev=Get-Content (Join-Path $env:W6E_EVIDENCE 'w6d-published-windows-evidence.json') -Raw -Encoding UTF8|ConvertFrom-Json
          if($ev.schema-ne 'ainovel-w6d-published-windows/1' -or $ev.release_commit-ne $env:LOCKED_FINAL_SHA -or $ev.tag-ne $env:RELEASE_TAG -or $ev.binary_source-ne 'github-release-live-asset' -or $ev.desktop_build_performed -or -not $ev.first_ready -or -not $ev.restart_ready -or -not $ev.restart_resume_detected -or $ev.runtime_no_api_marker_scan-ne 'PASS' -or $ev.w55_static_no_api_gate-ne 'PASS' -or -not $ev.no_upstream_fallback){throw 'W6E live desktop authority failed'}
          Write-Host 'W6E LIVE RELEASE REAL DESKTOP AUTHORITY: PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: ainovel-w6e-published-windows-authority-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.W6E_EVIDENCE }}/w6d-published-windows-evidence.json
            ${{ env.W6E_EVIDENCE }}/w6c-readiness-evidence.json
      - name: Cleanup and restore local config
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          if($env:W6E_HAD -eq 'True' -and (Test-Path $env:W6E_BAK)){Copy-Item $env:W6E_BAK $env:W6E_CFG -Force}elseif($env:W6E_CFG){Remove-Item $env:W6E_CFG -Force -ErrorAction SilentlyContinue}
          foreach($p in @($env:W6E_BASE,(Join-Path $env:RUNNER_TEMP ("w6e-helper-"+$env:GITHUB_RUN_ID)),$env:W6E_BAK)){if($p){Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue}}
