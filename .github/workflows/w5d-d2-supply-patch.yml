name: W5D D2 supply-chain patch

on:
  push:
    branches:
      - w5d-cost-update-docs-safety

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[w5d-d2-supply]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w5d-cost-update-docs-safety
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Apply guarded D2 supply-chain patch
        run: python3 .github/scripts/w5d_patch_d2_supply.py
      - name: Format changed Go files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t gofiles < <(git diff --name-only --diff-filter=ACMRT -- '*.go' | sort -u)
          if (( ${#gofiles[@]} > 0 )); then
            gofmt -w "${gofiles[@]}"
          fi
      - name: Shell syntax
        run: |
          bash -n scripts/install.sh
          bash -n .github/scripts/gen-changelog.sh
      - name: Diff integrity
        run: git diff --check
      - name: Vet
        run: go vet ./...
      - name: Full tests
        run: go test ./...
      - name: Supply-chain residue gate
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'Repo:[[:space:]]*"voocel/ainovel-cli"|REPO="voocel/ainovel-cli"|raw\.githubusercontent\.com/voocel/ainovel-cli|github\.com/voocel/ainovel-cli/releases|ghcr\.io/voocel/ainovel-cli|owner:[[:space:]]*voocel' \
            cmd/ainovel-cli internal/version scripts/install.sh .goreleaser.yml .github/workflows/release.yml .github/scripts/gen-changelog.sh
          ! grep -RInE 'GEMINI_API_KEY|ANTHROPIC_API_KEY|OPENAI_API_KEY|generativelanguage\.googleapis\.com|api\.anthropic\.com|api\.openai\.com' \
            .github/workflows/release.yml .github/scripts/gen-changelog.sh
          test ! -e Dockerfile
          test ! -e docker-compose.yml
          test ! -e .dockerignore
          test ! -e .github/workflows/docker.yml
          grep -Fq 'tiktok1997af-dot/ainovel-cli' scripts/install.sh
          grep -Fq 'owner: tiktok1997af-dot' .goreleaser.yml
          grep -Fq 'ProductRepository' cmd/ainovel-cli/main.go
      - name: Commit verified D2 refactor
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No D2 source changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(w5d): secure updater install and release supply chain [w5d-d2-supply]'
          git push origin HEAD:w5d-cost-update-docs-safety
