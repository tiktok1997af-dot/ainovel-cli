name: W5C C4 source patch

on:
  push:
    branches:
      - w5c-remove-legacy-api-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w5c-remove-legacy-api-runtime
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply C4 source patch
        run: |
          python .github/w5c_c4_patch.py
          gofmt -w internal/bootstrap/setup.go internal/host/host.go internal/host/imp/call.go internal/bootstrap/config.go internal/bootstrap/configfile.go internal/bootstrap/models.go
          go mod tidy
      - name: Commit C4 source patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/bootstrap/setup.go internal/host/host.go internal/host/imp/call.go internal/bootstrap/config.go internal/bootstrap/configfile.go internal/bootstrap/models.go go.mod go.sum
          git diff --cached --quiet && exit 0
          git commit -m "refactor(w5c): remove legacy API schema and runtime residue"
          git push origin HEAD:w5c-remove-legacy-api-runtime
