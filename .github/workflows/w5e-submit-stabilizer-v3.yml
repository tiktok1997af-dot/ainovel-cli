name: W5E submit-control stabilizer v3

on:
  push:
    branches:
      - w5e-submit-stabilizer

permissions:
  contents: write

jobs:
  apply-submit-stabilization-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stabilizer authority
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify exact W5E base
        shell: bash
        env:
          EXPECTED_BASE: d48f6e1eb54125d6945c0aa718d0cc04a8961b6f
          TARGET_BRANCH: w5e-real-production-app-smoke
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_sha" = "$EXPECTED_BASE" || { echo "::error::W5E target drift: expected $EXPECTED_BASE, got $remote_sha"; exit 1; }
          git fetch origin "${TARGET_BRANCH}"
          git switch -C "${TARGET_BRANCH}" FETCH_HEAD

      - name: Apply guarded submit-control patch
        shell: bash
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/scripts/w5e_submit_stabilizer.py"
          gofmt -w internal/webai/sites/gemini_interaction.go
          git diff --check
          go test -buildvcs=false -count=1 ./internal/webai/sites ./internal/webai

      - name: Commit exact stabilization to W5E branch
        shell: bash
        env:
          TARGET_BRANCH: w5e-real-production-app-smoke
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/webai/sites/gemini_interaction.go
          if git diff --cached --quiet; then
            echo '::error::stabilizer produced no production patch'
            exit 1
          fi
          git commit -m 'fix(webai): stabilize Gemini native send action'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
