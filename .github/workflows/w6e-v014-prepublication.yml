name: W6E v0.1.4 Prepublication

on:
  push:
    branches:
      - w6e-v0.1.4-prepublication
      - w6e-v0.1.4-publication-authority

permissions:
  contents: read

env:
  PRODUCT_REPOSITORY: tiktok1997af-dot/ainovel-cli
  RELEASE_TAG: v0.1.4
  PREVIOUS_RELEASE_TAG: v0.1.3
  LOCKED_FINAL_SHA: 95ffc80a90f8bf4a014c70ea7cc8bf47c51df31e

jobs:
  prepublication:
    name: Frozen SHA prepublication authority
    if: ${{ github.repository == 'tiktok1997af-dot/ainovel-cli' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify bounded publication-control diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$LOCKED_FINAL_SHA" HEAD
          python3 - <<'PY'
          import os, re, subprocess
          locked=os.environ['LOCKED_FINAL_SHA']
          tag=os.environ['RELEASE_TAG']
          changed=set(subprocess.check_output(['git','diff','--name-only',f'{locked}..HEAD'],text=True).splitlines())
          allowed={
            '.github/workflows/w6e-v014-prepublication.yml',
            '.github/workflows/w6e-v014-publish.yml',
            'docs/w6e-v0.1.4-live-publication-authority.md',
          }
          required={'.github/workflows/w6e-v014-prepublication.yml','.github/workflows/w6e-v014-publish.yml'}
          extra=changed-allowed; missing=required-changed
          if extra or missing:
              raise SystemExit(f'W6E bounded control diff failed; changed={sorted(changed)} extra={sorted(extra)} missing={sorted(missing)}')
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)',tag):
              raise SystemExit('invalid strict SemVer target')
          print('W6E bounded publication-control diff PASS:', ', '.join(sorted(changed)))
          PY

      - name: Verify monotonic live release state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$(git ls-remote --tags origin refs/tags/$PREVIOUS_RELEASE_TAG)"
          test -z "$(git ls-remote --tags origin refs/tags/$RELEASE_TAG)"
          gh release view "$PREVIOUS_RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null
          if gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::target release $RELEASE_TAG already exists"
            exit 1
          fi
          echo "W6E release-state PASS: previous=$PREVIOUS_RELEASE_TAG target=$RELEASE_TAG absent"

      - name: Verify frozen release workflow contract
        shell: bash
        run: |
          set -euo pipefail
          git show "$LOCKED_FINAL_SHA:.github/workflows/release.yml" > /tmp/frozen-release.yml
          git show "$LOCKED_FINAL_SHA:.goreleaser.yml" > /tmp/frozen-goreleaser.yml
          grep -Fq "github.repository == 'tiktok1997af-dot/ainovel-cli'" /tmp/frozen-release.yml
          grep -Fq "startsWith(github.ref, 'refs/tags/v')" /tmp/frozen-release.yml
          grep -Fq 'scripts/w55-no-api-audit.sh' /tmp/frozen-release.yml
          grep -Fq 'go test ./...' /tmp/frozen-release.yml
          grep -Fq 'v2.18.1' /tmp/frozen-release.yml
          grep -Fq 'owner: tiktok1997af-dot' /tmp/frozen-goreleaser.yml
          grep -Fq 'name: ainovel-cli' /tmp/frozen-goreleaser.yml
          grep -Fq 'name_template: "{{ .ProjectName }}_checksums.txt"' /tmp/frozen-goreleaser.yml
          grep -Fq 'algorithm: sha256' /tmp/frozen-goreleaser.yml

      - name: Checkout exact frozen product authority
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$LOCKED_FINAL_SHA"
          test "$(git rev-parse HEAD)" = "$LOCKED_FINAL_SHA"
          test -z "$(git status --porcelain)"

      - name: Repository-wide WEB-only / NO-API and Go regressions
        shell: bash
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          bash scripts/w55-no-api-audit.sh
          go test ./...
          go test ./internal/version

      - name: Deterministic release notes gate
        shell: bash
        run: |
          set -euo pipefail
          sh .github/scripts/gen-changelog.sh > /tmp/a.md
          sh .github/scripts/gen-changelog.sh > /tmp/b.md
          cmp /tmp/a.md /tmp/b.md
          python3 - <<'PY'
          import re
          body=open('/tmp/a.md',encoding='utf-8').read()
          pats=[
            r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
            r'\bghp_[A-Za-z0-9]{20,}\b',
            r'\bgithub_pat_[A-Za-z0-9_]{20,}\b',
            r'\bAIza[0-9A-Za-z_-]{20,}\b',
            r'(?i)authorization\s*:\s*bearer\s+[A-Za-z0-9._~+/=-]{8,}',
            r'(?i)(?:api[_-]?key|password|secret|token)\s*[:=]\s*[A-Za-z0-9._~+/=-]{8,}',
          ]
          if any(re.search(p,body) for p in pats):
              raise SystemExit('release notes contain secret-like material')
          print('W6E deterministic release notes PASS')
          PY

      - name: Exact frozen non-publishing GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "v2.18.1"
          args: release --snapshot --clean

      - name: Verify exact frozen snapshot and write sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/w6e-evidence
          python3 scripts/w6a-verify-release-snapshot.py --dist dist --expected-sha "$LOCKED_FINAL_SHA" --evidence dist/w6e-evidence/w6e-snapshot-evidence.json
          python3 - <<'PY'
          import json,os
          ev={
            'schema':'ainovel-w6e-prepublication/1',
            'repository':os.environ['PRODUCT_REPOSITORY'],
            'control_sha':os.environ['GITHUB_SHA'],
            'release_candidate_sha':os.environ['LOCKED_FINAL_SHA'],
            'previous_release_tag':os.environ['PREVIOUS_RELEASE_TAG'],
            'release_tag':os.environ['RELEASE_TAG'],
            'bounded_control_diff':True,
            'target_tag_absent':True,
            'target_release_absent':True,
            'w55_no_api':'PASS',
            'go_regression':'PASS',
            'release_notes_deterministic':True,
            'release_notes_secret_scan':'PASS',
            'goreleaser_snapshot':'PASS',
            'no_publish_snapshot':True,
          }
          open('dist/w6e-evidence/w6e-prepublication-evidence.json','w',encoding='utf-8').write(json.dumps(ev,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ainovel-w6e-prepublication-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: dist/w6e-evidence/*.json
