name: W5D D1 usage map

on:
  push:
    branches:
      - w5d-cost-update-docs-safety

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w5d-cost-update-docs-safety
      - name: Map usage and pricing references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== INTERNAL MODELS IMPORTS ==='
          grep -RInE 'internal/models|models\.' --include='*.go' . || true
          echo '=== USAGE API REFERENCES ==='
          grep -RInE 'UsageTracker|TotalInputTokens|TotalOutputTokens|TotalCostUSD|TotalSavedUSD|BudgetLimitUSD|CachePerAgent|CachePerModel|OverallCache|MissingAssistantUsage|SavedUSD\(|\.Totals\(\)|\.PerAgent\(\)|\.PerModel\(\)|ReplaySessions|LoadFromStore|StartAutoSave|WaitAutoSave|SaveNow' --include='*.go' . || true
          echo '=== USD/CACHE UI REFERENCES ==='
          grep -RInE 'formatCostUSD|cacheHitRate|prompt cache|stream_options\.include_usage|cost_usd|saved_usd' --include='*.go' internal || true
