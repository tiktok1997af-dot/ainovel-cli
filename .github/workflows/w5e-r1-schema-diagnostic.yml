name: W5E R1 schema diagnostic desktop

on:
  push:
    branches:
      - w5e-r1-schema-diagnostic-orchestrator

permissions:
  contents: read

concurrency:
  group: w5e-r1-real-desktop
  cancel-in-progress: true

jobs:
  schema-diagnostic:
    name: Real Windows desktop / sanitized schema diagnostic
    runs-on: [self-hosted, Windows, X64, ainovel-w5e-desktop]
    timeout-minutes: 60

    steps:
      - name: Checkout exact W5E candidate
        uses: actions/checkout@v4
        with:
          ref: aa1dfd21b801f2d211418ee3be289399ad88babe
          fetch-depth: 0

      - name: Setup Go from exact candidate
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Force Git Bash
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          $bash = Join-Path $gitBin 'bash.exe'
          if (-not (Test-Path -LiteralPath $bash)) {
            throw 'Git Bash is required but bash.exe was not found under Program Files\Git\bin.'
          }
          [System.IO.File]::AppendAllText(
            $env:GITHUB_PATH,
            "$gitBin`r`n",
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Verify exact candidate and interactive desktop session
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'aa1dfd21b801f2d211418ee3be289399ad88babe'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "Candidate drift: expected $expected but checked out $actual"
          }

          $runnerSession = (Get-Process -Id $PID).SessionId
          $interactiveExplorer = Get-Process explorer -ErrorAction SilentlyContinue |
            Where-Object { $_.SessionId -eq $runnerSession } |
            Select-Object -First 1
          if ($null -eq $interactiveExplorer) {
            throw 'Runner is not in an interactive Windows desktop session.'
          }

          foreach ($required in @('go','git','bash')) {
            if (-not (Get-Command $required -ErrorAction SilentlyContinue)) {
              throw "Required command is unavailable on the desktop runner: $required"
            }
          }

          Write-Host "W5E schema diagnostic precondition PASS: $actual"

      - name: Stage transient WEB-only desktop config
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $userHome = [Environment]::GetFolderPath('UserProfile')
          $configDir = Join-Path $userHome '.ainovel'
          $configPath = Join-Path $configDir 'config.json'
          $backupPath = Join-Path $env:RUNNER_TEMP ("w5e-schema-config-backup-" + $env:GITHUB_RUN_ID + ".json")
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null

          $hadOriginal = Test-Path -LiteralPath $configPath
          $profileName = 'default'
          $browserPath = ''
          $startUrl = ''

          if ($hadOriginal) {
            Copy-Item -LiteralPath $configPath -Destination $backupPath -Force
            try {
              $existing = Get-Content -LiteralPath $configPath -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($null -ne $existing.web) {
                if (-not [string]::IsNullOrWhiteSpace([string]$existing.web.profile_name)) {
                  $profileName = [string]$existing.web.profile_name
                }
                if (-not [string]::IsNullOrWhiteSpace([string]$existing.web.browser_path)) {
                  $browserPath = [string]$existing.web.browser_path
                }
                if (-not [string]::IsNullOrWhiteSpace([string]$existing.web.start_url)) {
                  $startUrl = [string]$existing.web.start_url
                }
              }
            } catch {
              Write-Host 'Existing config parse failed; exact bytes are backed up and will be restored.'
            }
          }

          $web = [ordered]@{
            enabled = $true
            site = 'gemini-web'
            profile_name = $profileName
          }
          if (-not [string]::IsNullOrWhiteSpace($browserPath)) { $web.browser_path = $browserPath }
          if (-not [string]::IsNullOrWhiteSpace($startUrl)) { $web.start_url = $startUrl }

          $cfg = [ordered]@{ web = $web; language = 'vi' }
          $json = $cfg | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText(
            $configPath,
            $json + "`r`n",
            (New-Object System.Text.UTF8Encoding($false))
          )

          $envLines = @(
            "W5E_LOCAL_CONFIG_PATH=$configPath",
            "W5E_LOCAL_CONFIG_BACKUP=$backupPath",
            "W5E_LOCAL_CONFIG_HAD_ORIGINAL=$hadOriginal"
          ) -join "`r`n"
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            $envLines + "`r`n",
            (New-Object System.Text.UTF8Encoding($false))
          )

          Write-Host "Transient WEB-only config staged for profile '$profileName'."

      - name: Reproduce smoke and capture sanitized validation details
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDir = Join-Path $env:RUNNER_TEMP ("ainovel-w5e-schema-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "W5E_EVIDENCE_DIR=$evidenceDir`r`n",
            (New-Object System.Text.UTF8Encoding($false))
          )

          if ($null -eq (Get-Variable IsWindows -Scope Global -ErrorAction SilentlyContinue)) {
            $global:IsWindows = $true
          }

          function Protect-DiagnosticLine([string]$InputLine) {
            if ([string]::IsNullOrWhiteSpace($InputLine)) { return '' }
            $line = $InputLine
            $line = [regex]::Replace($line, "`e\[[0-9;]*[A-Za-z]", '')
            $userHome = [Environment]::GetFolderPath('UserProfile')
            if (-not [string]::IsNullOrWhiteSpace($userHome)) {
              $line = $line.Replace($userHome, '<USERPROFILE>')
            }
            $line = [regex]::Replace($line, '(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b', '<redacted-email>')
            $line = [regex]::Replace($line, '(?i)\b(cookie|authorization|bearer|token|password|secret|api[_-]?key)\b\s*[:=]\s*[^\s,;]+', '$1=<redacted>')
            $line = [regex]::Replace($line, '(?i)(https?://[^\s?#]+)(?:\?[^\s#]*)?(?:#[^\s]*)?', '$1')
            $line = [regex]::Replace($line, '"[^"\r\n]{80,}"', '"<redacted-long-string>"')
            $trimmed = $line.TrimStart()
            if ($trimmed.StartsWith('{') -or $trimmed -match '^\[\s*\{') {
              return '<redacted-structured-payload>'
            }
            if ($line.Length -gt 700) {
              $line = $line.Substring(0, 700) + '<truncated>'
            }
            return $line
          }

          function Get-SanitizedValidationDetails([string]$Path, [string]$Source) {
            $items = New-Object System.Collections.Generic.List[object]
            if (-not (Test-Path -LiteralPath $Path)) { return @() }

            $lines = @(Get-Content -LiteralPath $Path -Encoding UTF8 -Tail 260 -ErrorAction SilentlyContinue)
            $window = 0
            foreach ($raw in $lines) {
              $line = [string]$raw
              if ([string]::IsNullOrWhiteSpace($line)) { continue }

              $marker = $line -match '(?i)(InputValidationError|raw_string_field|validate raw tool call|failed due to the following issues|tool precondition failed)'
              if ($marker) { $window = 18 }
              elseif ($window -gt 0) { $window-- }

              $detail = $line -match '(?i)(field|path|argument|parameter|required|missing|invalid|expected|must be|type|schema|one of|cannot|empty|null|array|string|object|number|boolean|precondition)'
              if (-not $marker -and -not ($window -gt 0 -and $detail)) { continue }

              $safe = Protect-DiagnosticLine $line
              if ([string]::IsNullOrWhiteSpace($safe)) { continue }
              $items.Add([ordered]@{ source = $Source; line = $safe })
            }

            return @($items | Select-Object -Last 40)
          }

          try {
            & ./scripts/w5e-production-smoke.ps1 `
              -RepoRoot $env:GITHUB_WORKSPACE `
              -EvidenceDir $evidenceDir `
              -ReadinessTimeoutSeconds 60 `
              -FirstChapterTimeoutSeconds 1200 `
              -ResumeTimeoutSeconds 1200
          } catch {
            $message = Protect-DiagnosticLine ([string]$_.Exception.Message)
            if ($message.Length -gt 4000) {
              $message = $message.Substring(0, 4000) + '<truncated>'
            }

            $details = New-Object System.Collections.Generic.List[object]
            foreach ($entry in @(
              @{ path = (Join-Path $evidenceDir 'first.stderr.log'); source = 'first.stderr' },
              @{ path = (Join-Path $evidenceDir 'resume.stderr.log'); source = 'resume.stderr' }
            )) {
              foreach ($item in @(Get-SanitizedValidationDetails $entry.path $entry.source)) {
                $details.Add($item)
              }
            }

            $diag = [ordered]@{
              schema = 'ainovel-w5e-desktop-failure/2'
              diagnostic_only = $true
              candidate_sha = 'aa1dfd21b801f2d211418ee3be289399ad88babe'
              run_id = [string]$env:GITHUB_RUN_ID
              stage = 'production-smoke'
              error = $message
              validation_details = @($details | Select-Object -Last 60)
              raw_logs_uploaded = $false
              captured_at = (Get-Date).ToUniversalTime().ToString('o')
            }
            $diagPath = Join-Path $evidenceDir 'w5e-schema-failure-diagnostic.json'
            $diag | ConvertTo-Json -Depth 7 | Set-Content -LiteralPath $diagPath -Encoding UTF8
            Write-Host "Sanitized validation diagnostic captured with $($diag.validation_details.Count) detail line(s)."
            throw
          }

          throw 'Diagnostic-only rerun unexpectedly passed; no schema failure was reproduced. Do not treat this workflow as authority evidence.'

      - name: Upload sanitized schema diagnostic only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: w5e-r1-schema-failure-diagnostic
          path: ${{ env.W5E_EVIDENCE_DIR }}/w5e-schema-failure-diagnostic.json
          if-no-files-found: error
          retention-days: 3

      - name: Restore local config exactly
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          if ([string]::IsNullOrWhiteSpace($env:W5E_LOCAL_CONFIG_PATH)) {
            Write-Host 'No transient local config was staged.'
            exit 0
          }
          if ($env:W5E_LOCAL_CONFIG_HAD_ORIGINAL -eq 'True') {
            if (Test-Path -LiteralPath $env:W5E_LOCAL_CONFIG_BACKUP) {
              Copy-Item -LiteralPath $env:W5E_LOCAL_CONFIG_BACKUP -Destination $env:W5E_LOCAL_CONFIG_PATH -Force
              Remove-Item -LiteralPath $env:W5E_LOCAL_CONFIG_BACKUP -Force -ErrorAction SilentlyContinue
              Write-Host 'Original local config restored exactly.'
            } else {
              Write-Error 'Expected local config backup is missing.'
              exit 1
            }
          } else {
            Remove-Item -LiteralPath $env:W5E_LOCAL_CONFIG_PATH -Force -ErrorAction SilentlyContinue
            Write-Host 'Transient local config removed; original state restored.'
          }
