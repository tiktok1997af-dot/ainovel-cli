name: GUI-02A Minimal Runner Probe

on:
  push:
    branches:
      - feat/gui-02a-wails-react-shell

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, ainovel-w5e-desktop]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        shell: powershell
        run: |
          Write-Host "GUI-02A runner probe"
          git rev-parse HEAD
