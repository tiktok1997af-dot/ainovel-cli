name: W6D R2 Live Release Desktop Recovery

on:
  push:
    branches:
      - w6d-r2-live-release-desktop-recovery

permissions:
  contents: read

env:
  PRODUCT_REPOSITORY: tiktok1997af-dot/ainovel-cli
  RELEASE_TAG: v0.1.0
  RELEASE_VERSION: 0.1.0
  RELEASE_AUTHORITY_SHA: dc7d53edb5d0c9f1a343a1c224c800b335704368

jobs:
  hosted-proof:
    name: Immutable live release + helper proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_AUTHORITY_SHA }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Re-prove immutable live v0.1.0 authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_AUTHORITY_SHA"
          test "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")" = "$RELEASE_AUTHORITY_SHA	refs/tags/$RELEASE_TAG"
          mkdir -p published dist/w6d-r2
          gh api "repos/$PRODUCT_REPOSITORY/releases/tags/$RELEASE_TAG" > /tmp/release.json
          gh release download "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --dir published
          python3 scripts/w6d-verify-published-release.py --release-json /tmp/release.json --assets-dir published --expected-tag "$RELEASE_TAG" --expected-sha "$RELEASE_AUTHORITY_SHA" --output dist/w6d-r2/w6d-r2-live-release-evidence.json
          bash scripts/w55-no-api-audit.sh
          echo 'W6D-R2 immutable live release authority PASS.'
      - name: Build readiness helper outside release assets
        shell: bash
        env:
          GOWORK: "off"
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/w6d-r2-helper
          go build -trimpath -buildvcs=true -o dist/w6d-r2-helper/ainovel-w5e-readiness.exe ./cmd/ainovel-w5e-readiness
      - uses: actions/upload-artifact@v4
        with:
          name: ainovel-w6d-r2-readiness-helper-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: dist/w6d-r2-helper/ainovel-w5e-readiness.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ainovel-w6d-r2-hosted-authority-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: dist/w6d-r2/w6d-r2-live-release-evidence.json

  desktop:
    name: Real Windows desktop / immutable live v0.1.0
    needs: hosted-proof
    runs-on: [self-hosted, Windows, X64, ainovel-w5e-desktop]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_AUTHORITY_SHA }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ainovel-w6d-r2-readiness-helper-${{ github.sha }}
          path: ${{ runner.temp }}/w6d-r2-helper-${{ github.run_id }}

      - name: Force Git Bash
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $gitBin=Join-Path $env:ProgramFiles 'Git\bin'
          $bash=Join-Path $gitBin 'bash.exe'
          if(-not(Test-Path -LiteralPath $bash)){throw 'Git Bash is required.'}
          [IO.File]::AppendAllText($env:GITHUB_PATH,$gitBin+"`r`n",(New-Object Text.UTF8Encoding($false)))

      - name: Download immutable live Windows asset and stage desktop authority
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim().ToLowerInvariant() -ne $env:RELEASE_AUTHORITY_SHA) { throw 'release authority checkout drift' }
          foreach($required in @('git','bash')){if(-not(Get-Command $required -ErrorAction SilentlyContinue)){throw "required command unavailable: $required"}}
          $tagRef=(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG").Trim()
          if ($tagRef -ne ($env:RELEASE_AUTHORITY_SHA+"`trefs/tags/"+$env:RELEASE_TAG)) { throw 'release tag drift' }
          $base=Join-Path $env:RUNNER_TEMP ("w6d-r2-"+$env:GITHUB_RUN_ID)
          $input=Join-Path $base 'input';$evidence=Join-Path $base 'evidence';$runtime=Join-Path $base 'runtime'
          foreach($p in @($base,$input,$evidence,$runtime)){New-Item -ItemType Directory -Force -Path $p|Out-Null}
          $archive=Join-Path $input 'ainovel-cli_0.1.0_Windows_x86_64.zip'
          $checksums=Join-Path $input 'ainovel-cli_checksums.txt'
          $url='https://github.com/tiktok1997af-dot/ainovel-cli/releases/download/v0.1.0'
          & curl.exe -fL --proto '=https' --proto-redir '=https' --tlsv1.2 -o $archive "$url/ainovel-cli_0.1.0_Windows_x86_64.zip"
          if($LASTEXITCODE-ne 0){throw 'live archive download failed'}
          & curl.exe -fL --proto '=https' --proto-redir '=https' --tlsv1.2 -o $checksums "$url/ainovel-cli_checksums.txt"
          if($LASTEXITCODE-ne 0){throw 'live checksum download failed'}
          $helperRoot=Join-Path $env:RUNNER_TEMP ("w6d-r2-helper-"+$env:GITHUB_RUN_ID)
          $helper=@(Get-ChildItem -LiteralPath $helperRoot -Filter 'ainovel-w5e-readiness.exe' -File -Recurse)
          if($helper.Count-ne 1){throw 'helper ambiguity'}
          $hash=(Get-FileHash $helper[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $session=(Get-Process -Id $PID).SessionId
          if($null-eq (Get-Process explorer -ErrorAction SilentlyContinue|Where-Object{$_.SessionId-eq $session}|Select-Object -First 1)){throw 'non-interactive desktop'}
          $userHome=[Environment]::GetFolderPath('UserProfile')
          $dir=Join-Path $userHome '.ainovel';$cfg=Join-Path $dir 'config.json';$bak=Join-Path $env:RUNNER_TEMP ("w6d-r2-config-"+$env:GITHUB_RUN_ID+'.bak')
          New-Item -ItemType Directory -Force -Path $dir|Out-Null
          $had=Test-Path $cfg
          @("W6D_R2_BASE=$base","W6D_R2_ARCHIVE=$archive","W6D_R2_CHECKSUMS=$checksums","W6D_R2_EVIDENCE=$evidence","W6D_R2_RUNTIME=$runtime","W6D_R2_HELPER=$($helper[0].FullName)","W6D_R2_HELPER_HASH=$hash","W6D_R2_CFG=$cfg","W6D_R2_BAK=$bak","W6D_R2_HAD=$had")|ForEach-Object{[IO.File]::AppendAllText($env:GITHUB_ENV,$_+"`r`n",(New-Object Text.UTF8Encoding($false)))}
          $profile='default';$browser='';$start=''
          if($had){Copy-Item $cfg $bak -Force;try{$old=Get-Content $cfg -Raw -Encoding UTF8|ConvertFrom-Json;if($old.web){if($old.web.profile_name){$profile=[string]$old.web.profile_name};if($old.web.browser_path){$browser=[string]$old.web.browser_path};if($old.web.start_url){$start=[string]$old.web.start_url}}}catch{}}
          $web=[ordered]@{enabled=$true;site='gemini-web';profile_name=$profile};if($browser){$web.browser_path=$browser};if($start){$web.start_url=$start}
          [IO.File]::WriteAllText($cfg,(([ordered]@{web=$web;language='vi'}|ConvertTo-Json -Depth 6)+"`r`n"),(New-Object Text.UTF8Encoding($false)))

      - name: Run immutable live Windows WEB-only authority
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & ./scripts/w6d-published-windows-smoke.ps1 -RepoRoot $env:GITHUB_WORKSPACE -PackageArchivePath $env:W6D_R2_ARCHIVE -ChecksumManifestPath $env:W6D_R2_CHECKSUMS -ReadinessExe $env:W6D_R2_HELPER -ExpectedReadinessSha256 $env:W6D_R2_HELPER_HASH -ExpectedGitSha $env:RELEASE_AUTHORITY_SHA -ReleaseTag $env:RELEASE_TAG -EvidenceDir $env:W6D_R2_EVIDENCE -RuntimeDir $env:W6D_R2_RUNTIME

      - name: Validate sanitized W6D-R2 desktop evidence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ev=Get-Content (Join-Path $env:W6D_R2_EVIDENCE 'w6d-published-windows-evidence.json') -Raw -Encoding UTF8|ConvertFrom-Json
          if($ev.schema-ne 'ainovel-w6d-published-windows/1' -or $ev.repository-ne $env:PRODUCT_REPOSITORY -or $ev.tag-ne $env:RELEASE_TAG -or $ev.release_commit-ne $env:RELEASE_AUTHORITY_SHA -or $ev.binary_source-ne 'github-release-live-asset' -or $ev.desktop_build_performed -or -not $ev.package_checksum_verified -or -not $ev.production_binary_commit_verified -or -not $ev.first_ready -or -not $ev.restart_ready -or -not $ev.restart_resume_detected -or $ev.runtime_no_api_marker_scan-ne 'PASS' -or $ev.w55_static_no_api_gate-ne 'PASS' -or -not $ev.no_upstream_fallback){throw 'W6D-R2 desktop authority failed'}
          $completed=@($ev.completed_chapters|ForEach-Object{[int]$_});if($completed-notcontains 1 -or $completed-notcontains 2){throw 'chapter completion witness failed'}
          $tools=@($ev.observed_local_tools|ForEach-Object{[string]$_});foreach($tool in @('draft_chapter','commit_chapter')){if($tools-notcontains $tool){throw "missing tool witness: $tool"}}
          if([string]$ev.chapter_1_sha256_before_restart-ne[string]$ev.chapter_1_sha256_after_restart){throw 'chapter 1 persistence witness failed'}
          Write-Host 'W6D-R2 IMMUTABLE LIVE RELEASE REAL DESKTOP AUTHORITY: PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: ainovel-w6d-r2-published-windows-authority-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.W6D_R2_EVIDENCE }}/w6d-published-windows-evidence.json
            ${{ env.W6D_R2_EVIDENCE }}/w6c-readiness-evidence.json
            ${{ env.W6D_R2_EVIDENCE }}/w6c-release-artifact-smoke-evidence.json

      - name: Clean transient W6D-R2 data
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          foreach($p in @($env:W6D_R2_BASE,(Join-Path $env:RUNNER_TEMP ("w6d-r2-helper-"+$env:GITHUB_RUN_ID)))){if($p -and (Test-Path $p)){Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue}}
      - name: Restore local config exactly
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          if(-not $env:W6D_R2_CFG){exit 0}
          if($env:W6D_R2_HAD-eq 'True'){
            if(Test-Path $env:W6D_R2_BAK){Copy-Item $env:W6D_R2_BAK $env:W6D_R2_CFG -Force;Remove-Item $env:W6D_R2_BAK -Force -ErrorAction SilentlyContinue}else{throw 'config backup missing'}
          }else{Remove-Item $env:W6D_R2_CFG -Force -ErrorAction SilentlyContinue}
          Write-Host 'W6D-R2 local config state restored.'
