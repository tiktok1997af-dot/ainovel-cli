name: W5C C3 migration contract patch

on:
  push:
    branches:
      - w5c-remove-legacy-api-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w5c-remove-legacy-api-runtime
          fetch-depth: 0
      - name: Enforce WEB-only config migration contract
        shell: python
        run: |
          from pathlib import Path

          # config.go: hard-fail all non-WEB configs and preserve legacy fields only as migration detectors.
          p = Path('internal/bootstrap/config.go')
          s = p.read_text()
          start = s.index('// ValidateBase 校验基础配置。')
          end = s.index('func (c *Config) validateWebOnly() error {')
          replacement = r'''// LegacyAPIMigrationHint is intentionally stable and user-facing. Old API-era
// configuration is never interpreted as an alternate runtime path.
const LegacyAPIMigrationHint = "legacy AI provider/API configuration is no longer supported; set web.enabled=true and web.site=gemini-web, then remove provider/providers/api_key/base_url and role provider/model/fallback routing"

// ValidateBase validates the only supported product runtime: visible browser WEB-only.
func (c *Config) ValidateBase() error {
	if !c.Web.Enabled {
		if c.hasLegacyAPIRouting() {
			return fmt.Errorf("%s: %w", LegacyAPIMigrationHint, errs.ErrConfig)
		}
		return fmt.Errorf("WEB-only runtime requires web.enabled=true and web.site=gemini-web; login is completed manually in the visible Chrome session: %w", errs.ErrConfig)
	}
	return c.validateWebOnly()
}

func (c Config) hasLegacyAPIRouting() bool {
	if strings.TrimSpace(c.Provider) != "" || strings.TrimSpace(c.ModelName) != "" || len(c.Providers) != 0 {
		return true
	}
	for _, rc := range c.Roles {
		if strings.TrimSpace(rc.Provider) != "" || strings.TrimSpace(rc.Model) != "" || len(rc.Fallbacks) != 0 {
			return true
		}
	}
	return false
}

'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # configfile.go: merge browser fields, remove provider credential patch writer,
          # and make generic persistence validate/sanitize WEB-only state before writing.
          p = Path('internal/bootstrap/configfile.go')
          s = p.read_text()
          needle = '''\tif overlay.ModelName != "" {\n\t\tbase.ModelName = overlay.ModelName\n\t}\n'''
          insert = needle + '''\tif overlay.Web != (WebAIConfig{}) {\n\t\tif overlay.Web.Enabled {\n\t\t\tbase.Web.Enabled = true\n\t\t}\n\t\tif overlay.Web.Site != "" {\n\t\t\tbase.Web.Site = overlay.Web.Site\n\t\t}\n\t\tif overlay.Web.BrowserPath != "" {\n\t\t\tbase.Web.BrowserPath = overlay.Web.BrowserPath\n\t\t}\n\t\tif overlay.Web.ProfileName != "" {\n\t\t\tbase.Web.ProfileName = overlay.Web.ProfileName\n\t\t}\n\t\tif overlay.Web.StartURL != "" {\n\t\t\tbase.Web.StartURL = overlay.Web.StartURL\n\t\t}\n\t}\n'''
          if needle not in s:
              raise SystemExit('merge ModelName anchor not found')
          s = s.replace(needle, insert, 1)
          needle2 = '''\tif overlay.Style != "" {\n\t\tbase.Style = overlay.Style\n\t}\n'''
          insert2 = needle2 + '''\tif overlay.Language != "" {\n\t\tbase.Language = overlay.Language\n\t}\n'''
          if needle2 not in s:
              raise SystemExit('merge Style anchor not found')
          s = s.replace(needle2, insert2, 1)
          start = s.index('// SaveProviderConfig 补丁式更新目标配置层里单个 provider 的凭证与模型库。')
          end = s.index('// stripJSONComments 去除 JSON 中的 // 行注释')
          s = s[:start] + s[end:]
          old = '''func SaveConfig(path string, cfg Config) error {\n\tif err := os.MkdirAll(filepath.Dir(path), 0o755); err != nil {\n\t\treturn err\n\t}\n\tdata, err := json.MarshalIndent(cfg, "", "  ")\n'''
          new = '''func SaveConfig(path string, cfg Config) error {\n\tpersist := CloneConfig(cfg)\n\tpersist.FillDefaults()\n\tif err := persist.ValidateBase(); err != nil {\n\t\treturn fmt.Errorf("refusing to persist non-WEB configuration: %w", err)\n\t}\n\t// Provider/model are runtime compatibility aliases only. Never persist them,\n\t// and never persist an API provider credential map.\n\tpersist.Provider = ""\n\tpersist.ModelName = ""\n\tpersist.Providers = nil\n\n\tif err := os.MkdirAll(filepath.Dir(path), 0o755); err != nil {\n\t\treturn err\n\t}\n\tdata, err := json.MarshalIndent(persist, "", "  ")\n'''
          if old not in s:
              raise SystemExit('SaveConfig anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          Path('internal/bootstrap/config_test.go').write_text(r'''package bootstrap

import (
	"errors"
	"strings"
	"testing"

	"github.com/voocel/ainovel-cli/internal/errs"
	"github.com/voocel/ainovel-cli/internal/notify"
)

func webConfig() Config {
	return Config{Web: WebAIConfig{Enabled: true, Site: "gemini-web"}}
}

func TestConfigResolveReasoningEffort(t *testing.T) {
	cfg := webConfig()
	cfg.ReasoningEffort = "low"
	cfg.Roles = map[string]RoleConfig{
		"writer": {ReasoningEffort: "high"},
		"architect": {},
	}
	for role, want := range map[string]string{
		"writer": "high", "architect": "low", "editor": "low", "": "low", "default": "low", "arbiter": "low",
	} {
		if got := cfg.ResolveReasoningEffort(role); got != want {
			t.Errorf("ResolveReasoningEffort(%q) = %q, want %q", role, got, want)
		}
	}
}

func TestValidateBaseRequiresWebOnlyRuntime(t *testing.T) {
	cfg := Config{}
	err := cfg.ValidateBase()
	if !errors.Is(err, errs.ErrConfig) || !strings.Contains(err.Error(), "web.enabled=true") {
		t.Fatalf("missing WEB-only requirement: %v", err)
	}
}

func TestValidateBaseRejectsLegacyAPIConfigWithMigrationHint(t *testing.T) {
	cfg := Config{
		Provider: "openai", ModelName: "gpt-5",
		Providers: map[string]ProviderConfig{"openai": {APIKey: "secret", BaseURL: "https://api.example/v1"}},
	}
	err := cfg.ValidateBase()
	if !errors.Is(err, errs.ErrConfig) {
		t.Fatalf("legacy config must wrap ErrConfig: %v", err)
	}
	for _, want := range []string{"legacy AI provider/API", "web.enabled=true", "gemini-web", "api_key", "base_url"} {
		if !strings.Contains(err.Error(), want) {
			t.Fatalf("migration error missing %q: %v", want, err)
		}
	}
}

func TestValidateBaseRejectsLegacyRoleRoutingInsideWebMode(t *testing.T) {
	cfg := webConfig()
	cfg.Roles = map[string]RoleConfig{"writer": {Provider: "openai", Model: "gpt-5"}}
	if err := cfg.ValidateBase(); !errors.Is(err, errs.ErrConfig) || !strings.Contains(err.Error(), "legacy provider/model/fallback") {
		t.Fatalf("legacy role routing must fail closed: %v", err)
	}
}

func TestValidateBaseRejectsNonConfigurableRoles(t *testing.T) {
	for _, role := range []string{"coordinator", "arbiter"} {
		cfg := webConfig()
		cfg.Roles = map[string]RoleConfig{role: {ReasoningEffort: "low"}}
		if err := cfg.ValidateBase(); !errors.Is(err, errs.ErrConfig) {
			t.Fatalf("roles.%s must be rejected, got %v", role, err)
		}
	}
}

func TestValidateBaseNotifyEventsMatchRuntimeContract(t *testing.T) {
	cfg := webConfig()
	cfg.Notify = NotifyConfig{Events: notify.Kinds()}
	if err := cfg.ValidateBase(); err != nil {
		t.Fatalf("current notify kinds must validate: %v", err)
	}
	cfg.Notify = NotifyConfig{Events: []string{"repeat"}}
	if err := cfg.ValidateBase(); !errors.Is(err, errs.ErrConfig) {
		t.Fatalf("legacy repeat event must be rejected: %v", err)
	}
}
''')

          Path('internal/bootstrap/configfile_test.go').write_text(r'''package bootstrap

import (
	"encoding/json"
	"errors"
	"os"
	"path/filepath"
	"strings"
	"testing"

	"github.com/voocel/ainovel-cli/internal/errs"
)

const validGlobal = `{
  "web": {"enabled": true, "site": "gemini-web", "profile_name": "default"},
  "language": "vi",
  "context_window": 200000
}`

func writeGlobal(t *testing.T, content string) string {
	t.Helper()
	home := t.TempDir()
	t.Setenv("HOME", home)
	t.Setenv("USERPROFILE", home)
	dir := filepath.Join(home, ".ainovel")
	if err := os.MkdirAll(dir, 0o755); err != nil { t.Fatalf("mkdir: %v", err) }
	if content != "" {
		if err := os.WriteFile(filepath.Join(dir, "config.json"), []byte(content), 0o644); err != nil { t.Fatalf("write global: %v", err) }
	}
	return home
}

func writeProjectConfig(t *testing.T, content string) {
	t.Helper()
	if err := os.MkdirAll(".ainovel", 0o755); err != nil { t.Fatalf("mkdir .ainovel: %v", err) }
	if err := os.WriteFile(filepath.Join(".ainovel", "config.json"), []byte(content), 0o644); err != nil { t.Fatalf("write project: %v", err) }
}

func TestLoadConfig_CorruptProjectFailsLoud(t *testing.T) {
	writeGlobal(t, validGlobal)
	t.Chdir(t.TempDir())
	writeProjectConfig(t, `{ "web": {"enabled": true}, }`)
	if _, err := LoadConfig(); err == nil { t.Fatal("corrupt project config must fail loud") }
}

func TestLoadConfig_CorruptGlobalDoesNotBlockProjectOverride(t *testing.T) {
	writeGlobal(t, `{ not json`)
	t.Chdir(t.TempDir())
	writeProjectConfig(t, validGlobal)
	cfg, err := LoadConfig()
	if err != nil { t.Fatalf("corrupt global must not block project config: %v", err) }
	if !cfg.Web.Enabled || cfg.Web.Site != "gemini-web" { t.Fatalf("project WEB config not loaded: %#v", cfg.Web) }
}

func TestEffectiveConfigPathPrefersProject(t *testing.T) {
	writeGlobal(t, validGlobal)
	t.Chdir(t.TempDir())
	if got := EffectiveConfigPath(); got != DefaultConfigPath() { t.Fatalf("no project config: got %q", got) }
	proj := t.TempDir(); t.Chdir(proj); writeProjectConfig(t, validGlobal)
	want, _ := filepath.Abs(filepath.Join(".ainovel", "config.json"))
	if got := EffectiveConfigPath(); got != want { t.Fatalf("project config path = %q want %q", got, want) }
}

func TestLoadConfig_MissingFilesNoError(t *testing.T) {
	home := t.TempDir(); t.Setenv("HOME", home); t.Setenv("USERPROFILE", home); t.Chdir(t.TempDir())
	if _, err := LoadConfig(); err != nil { t.Fatalf("missing configs should be allowed: %v", err) }
}

func TestLoadConfig_WebOverlayMergesBrowserAndCreativeFields(t *testing.T) {
	writeGlobal(t, validGlobal)
	t.Chdir(t.TempDir())
	writeProjectConfig(t, `{
  "web": {"profile_name": "project-profile", "browser_path": "/custom/chrome"},
  "language": "zh",
  "reasoning_effort": "high",
  "roles": {"writer": {"reasoning_effort": "low"}}
}`)
	cfg, err := LoadConfig(); if err != nil { t.Fatalf("load: %v", err) }
	if !cfg.Web.Enabled || cfg.Web.Site != "gemini-web" || cfg.Web.ProfileName != "project-profile" || cfg.Web.BrowserPath != "/custom/chrome" { t.Fatalf("web merge failed: %#v", cfg.Web) }
	if cfg.Language != "zh" || cfg.ReasoningEffort != "high" || cfg.Roles["writer"].ReasoningEffort != "low" { t.Fatalf("creative merge failed: %#v", cfg) }
}

func TestLegacyAPIFileLoadsOnlyForMigrationAndFailsValidation(t *testing.T) {
	path := filepath.Join(t.TempDir(), "legacy.json")
	legacy := `{"provider":"openai","model":"gpt-5","providers":{"openai":{"api_key":"secret","base_url":"https://api.example/v1"}}}`
	if err := os.WriteFile(path, []byte(legacy), 0o600); err != nil { t.Fatal(err) }
	cfg, err := LoadConfigFile(path); if err != nil { t.Fatalf("parse legacy file: %v", err) }
	if err := cfg.ValidateBase(); !errors.Is(err, errs.ErrConfig) || !strings.Contains(err.Error(), LegacyAPIMigrationHint) { t.Fatalf("legacy file must produce migration error: %v", err) }
}

func TestSaveConfigRejectsAPICredentialsAndSanitizesWebAliases(t *testing.T) {
	path := filepath.Join(t.TempDir(), ".ainovel", "config.json")
	legacy := Config{Provider: "openai", ModelName: "gpt-5", Providers: map[string]ProviderConfig{"openai": {APIKey: "secret"}}}
	if err := SaveConfig(path, legacy); err == nil || !strings.Contains(err.Error(), "legacy AI provider/API") { t.Fatalf("SaveConfig must reject API config: %v", err) }

	cfg := Config{Web: WebAIConfig{Enabled: true, Site: "gemini-web", ProfileName: "default"}, Provider: "web", ModelName: "gemini-web", Language: "vi"}
	if err := SaveConfig(path, cfg); err != nil { t.Fatalf("save WEB config: %v", err) }
	data, err := os.ReadFile(path); if err != nil { t.Fatal(err) }
	text := string(data)
	for _, forbidden := range []string{`"provider"`, `"model"`, `"providers"`, `"api_key"`, `"base_url"`} {
		if strings.Contains(text, forbidden) { t.Fatalf("WEB persistence leaked legacy key %s:\n%s", forbidden, text) }
	}
	var round Config
	if err := json.Unmarshal(data, &round); err != nil { t.Fatalf("saved JSON: %v", err) }
	if !round.Web.Enabled || round.Web.Site != "gemini-web" { t.Fatalf("saved WEB config invalid: %#v", round.Web) }
}

func TestExampleConfigIsValidAndSelfConsistent(t *testing.T) {
	root, err := os.ReadFile(filepath.Join("..", "..", "config.example.jsonc")); if err != nil { t.Fatal(err) }
	packaged, err := os.ReadFile(filepath.Join("..", "..", "config", "config.example.jsonc")); if err != nil { t.Fatal(err) }
	if string(root) != exampleConfig || string(packaged) != exampleConfig { t.Fatal("example configs must be synchronized") }
	var cfg Config
	if err := json.Unmarshal(stripJSONComments([]byte(exampleConfig)), &cfg); err != nil { t.Fatalf("example JSON: %v", err) }
	if !cfg.Web.Enabled || cfg.Web.Site != "gemini-web" || len(cfg.Providers) != 0 { t.Fatalf("example is not WEB-only: %#v", cfg) }
	cfg.FillDefaults(); if err := cfg.ValidateBase(); err != nil { t.Fatalf("example ValidateBase: %v", err) }
}

func TestWriteStartupError(t *testing.T) {
	home := t.TempDir(); t.Setenv("HOME", home); t.Setenv("USERPROFILE", home)
	path := WriteStartupError("boom: browser config invalid"); if path == "" { t.Fatal("startup error path missing") }
	data, err := os.ReadFile(path); if err != nil { t.Fatal(err) }
	if !strings.Contains(string(data), "boom: browser config invalid") { t.Fatalf("startup log missing message: %s", data) }
}
''')
      - name: Format
        run: gofmt -w internal/bootstrap/config.go internal/bootstrap/configfile.go internal/bootstrap/config_test.go internal/bootstrap/configfile_test.go
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/bootstrap/config.go internal/bootstrap/configfile.go internal/bootstrap/config_test.go internal/bootstrap/configfile_test.go
          git diff --cached --quiet && exit 0
          git commit -m "feat(w5c): enforce WEB-only config migration contract"
          git push origin HEAD:w5c-remove-legacy-api-runtime
