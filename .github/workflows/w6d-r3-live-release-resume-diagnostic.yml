name: W6D R3 Live Release Resume Diagnostic

on:
  push:
    branches:
      - w6d-r3-live-release-resume-diagnostic

permissions:
  contents: read

env:
  PRODUCT_REPOSITORY: tiktok1997af-dot/ainovel-cli
  RELEASE_TAG: v0.1.0
  RELEASE_VERSION: 0.1.0
  RELEASE_AUTHORITY_SHA: dc7d53edb5d0c9f1a343a1c224c800b335704368

jobs:
  hosted-proof:
    name: Immutable live release + helper proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_AUTHORITY_SHA }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Re-prove immutable live v0.1.0 authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_AUTHORITY_SHA"
          test "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")" = "$RELEASE_AUTHORITY_SHA	refs/tags/$RELEASE_TAG"
          mkdir -p published dist/w6d-r3
          gh api "repos/$PRODUCT_REPOSITORY/releases/tags/$RELEASE_TAG" > /tmp/release.json
          gh release download "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --dir published
          python3 scripts/w6d-verify-published-release.py --release-json /tmp/release.json --assets-dir published --expected-tag "$RELEASE_TAG" --expected-sha "$RELEASE_AUTHORITY_SHA" --output dist/w6d-r3/w6d-r3-live-release-evidence.json
          bash scripts/w55-no-api-audit.sh
      - name: Build readiness helper outside release assets
        shell: bash
        env:
          GOWORK: "off"
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/w6d-r3-helper
          go build -trimpath -buildvcs=true -o dist/w6d-r3-helper/ainovel-w5e-readiness.exe ./cmd/ainovel-w5e-readiness
      - uses: actions/upload-artifact@v4
        with:
          name: ainovel-w6d-r3-readiness-helper-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: dist/w6d-r3-helper/ainovel-w5e-readiness.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ainovel-w6d-r3-hosted-authority-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: dist/w6d-r3/w6d-r3-live-release-evidence.json

  desktop:
    name: Real Windows desktop / live v0.1.0 resume diagnostic
    needs: hosted-proof
    runs-on: [self-hosted, Windows, X64, ainovel-w5e-desktop]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_AUTHORITY_SHA }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ainovel-w6d-r3-readiness-helper-${{ github.sha }}
          path: ${{ runner.temp }}/w6d-r3-helper-${{ github.run_id }}

      - name: Force Git Bash
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $gitBin=Join-Path $env:ProgramFiles 'Git\bin'
          if(-not(Test-Path -LiteralPath (Join-Path $gitBin 'bash.exe'))){throw 'Git Bash is required.'}
          [IO.File]::AppendAllText($env:GITHUB_PATH,$gitBin+"`r`n",(New-Object Text.UTF8Encoding($false)))

      - name: Stage immutable live Windows authority
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim().ToLowerInvariant()-ne $env:RELEASE_AUTHORITY_SHA){throw 'release checkout drift'}
          foreach($required in @('git','bash')){if(-not(Get-Command $required -ErrorAction SilentlyContinue)){throw "required command unavailable: $required"}}
          $tagRef=(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG").Trim()
          if($tagRef-ne($env:RELEASE_AUTHORITY_SHA+"`trefs/tags/"+$env:RELEASE_TAG)){throw 'release tag drift'}
          $base=Join-Path $env:RUNNER_TEMP ("w6d-r3-"+$env:GITHUB_RUN_ID)
          $input=Join-Path $base 'input';$evidence=Join-Path $base 'evidence';$runtime=Join-Path $base 'runtime'
          foreach($p in @($base,$input,$evidence,$runtime)){New-Item -ItemType Directory -Force -Path $p|Out-Null}
          $archive=Join-Path $input 'ainovel-cli_0.1.0_Windows_x86_64.zip';$checksums=Join-Path $input 'ainovel-cli_checksums.txt'
          $url='https://github.com/tiktok1997af-dot/ainovel-cli/releases/download/v0.1.0'
          & curl.exe -fL --proto '=https' --proto-redir '=https' --tlsv1.2 -o $archive "$url/ainovel-cli_0.1.0_Windows_x86_64.zip";if($LASTEXITCODE-ne 0){throw 'live archive download failed'}
          & curl.exe -fL --proto '=https' --proto-redir '=https' --tlsv1.2 -o $checksums "$url/ainovel-cli_checksums.txt";if($LASTEXITCODE-ne 0){throw 'live checksum download failed'}
          $helperRoot=Join-Path $env:RUNNER_TEMP ("w6d-r3-helper-"+$env:GITHUB_RUN_ID);$helper=@(Get-ChildItem $helperRoot -Filter 'ainovel-w5e-readiness.exe' -File -Recurse)
          if($helper.Count-ne 1){throw 'helper ambiguity'};$helperHash=(Get-FileHash $helper[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $session=(Get-Process -Id $PID).SessionId;if($null-eq(Get-Process explorer -ErrorAction SilentlyContinue|Where-Object{$_.SessionId-eq $session}|Select-Object -First 1)){throw 'non-interactive desktop'}
          $userHome=[Environment]::GetFolderPath('UserProfile');$cfgDir=Join-Path $userHome '.ainovel';$cfg=Join-Path $cfgDir 'config.json';$bak=Join-Path $env:RUNNER_TEMP ("w6d-r3-config-"+$env:GITHUB_RUN_ID+'.bak')
          New-Item -ItemType Directory -Force -Path $cfgDir|Out-Null;$had=Test-Path $cfg
          $profile='default';$browser='';$start=''
          if($had){Copy-Item $cfg $bak -Force;try{$old=Get-Content $cfg -Raw -Encoding UTF8|ConvertFrom-Json;if($old.web){if($old.web.profile_name){$profile=[string]$old.web.profile_name};if($old.web.browser_path){$browser=[string]$old.web.browser_path};if($old.web.start_url){$start=[string]$old.web.start_url}}}catch{}}
          $web=[ordered]@{enabled=$true;site='gemini-web';profile_name=$profile};if($browser){$web.browser_path=$browser};if($start){$web.start_url=$start}
          [IO.File]::WriteAllText($cfg,(([ordered]@{web=$web;language='vi'}|ConvertTo-Json -Depth 6)+"`r`n"),(New-Object Text.UTF8Encoding($false)))
          @("W6D_R3_BASE=$base","W6D_R3_ARCHIVE=$archive","W6D_R3_CHECKSUMS=$checksums","W6D_R3_EVIDENCE=$evidence","W6D_R3_RUNTIME=$runtime","W6D_R3_HELPER=$($helper[0].FullName)","W6D_R3_HELPER_HASH=$helperHash","W6D_R3_CFG=$cfg","W6D_R3_BAK=$bak","W6D_R3_HAD=$had")|ForEach-Object{[IO.File]::AppendAllText($env:GITHUB_ENV,$_+"`r`n",(New-Object Text.UTF8Encoding($false)))}

      - name: Run immutable live Windows authority with diagnostic capture
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ok=$true;$err=''
          try {
            & ./scripts/w6d-published-windows-smoke.ps1 -RepoRoot $env:GITHUB_WORKSPACE -PackageArchivePath $env:W6D_R3_ARCHIVE -ChecksumManifestPath $env:W6D_R3_CHECKSUMS -ReadinessExe $env:W6D_R3_HELPER -ExpectedReadinessSha256 $env:W6D_R3_HELPER_HASH -ExpectedGitSha $env:RELEASE_AUTHORITY_SHA -ReleaseTag $env:RELEASE_TAG -EvidenceDir $env:W6D_R3_EVIDENCE -RuntimeDir $env:W6D_R3_RUNTIME
          } catch { $ok=$false;$err=[string]$_.Exception.Message }
          [IO.File]::AppendAllText($env:GITHUB_ENV,("W6D_R3_SMOKE_OK="+$ok+"`r`n"),(New-Object Text.UTF8Encoding($false)))
          if(-not $ok){
            $userHome=[Environment]::GetFolderPath('UserProfile');if($userHome){$err=$err.Replace($userHome,'<USERPROFILE>')}
            $err=[regex]::Replace($err,'(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b','<redacted-email>')
            $err=[regex]::Replace($err,'(?i)\b(cookie|authorization|bearer|token|password|secret|api[_-]?key)\b\s*[:=]\s*[^\s,;]+','$1=<redacted>')
            $progressPath=Join-Path $env:W6D_R3_RUNTIME 'output\novel\meta\progress.json';$progress=$null;if(Test-Path $progressPath){try{$progress=Get-Content $progressPath -Raw -Encoding UTF8|ConvertFrom-Json}catch{}}
            $completed=@();$phase='';$current=0;if($progress){$completed=@($progress.completed_chapters|ForEach-Object{[int]$_});$phase=[string]$progress.phase;$current=[int]$progress.current_chapter}
            $progressHash='';if(Test-Path $progressPath){$progressHash=(Get-FileHash $progressPath -Algorithm SHA256).Hash.ToLowerInvariant()}
            $resumeCode='';$resumeCodePath=Join-Path $env:W6D_R3_EVIDENCE 'resume.exitcode.txt';if(Test-Path $resumeCodePath){$resumeCode=(Get-Content $resumeCodePath -Raw -Encoding UTF8).Trim()}
            $chapterDir=Join-Path $env:W6D_R3_RUNTIME 'output\novel\chapters';$chapters=@();if(Test-Path $chapterDir){$chapters=@(Get-ChildItem $chapterDir -Filter '*.md' -File)}
            $sessionDir=Join-Path $env:W6D_R3_RUNTIME 'output\novel\meta\sessions\agents';$sessions=@();if(Test-Path $sessionDir){$sessions=@(Get-ChildItem $sessionDir -Filter '*.jsonl' -File)}
            function SafeDiag([string]$p){if(-not(Test-Path $p)){return '<missing>'};$pat='(?i)(error|fail|fatal|panic|auth|required|config|browser|chrome|web|headless|engine|invalid|missing|timeout|exit|cannot|unable|ready|denied|refused|unexpected|resume|chapter)';$safe=@();foreach($line in @(Get-Content $p -Encoding UTF8 -Tail 100 -ErrorAction SilentlyContinue)){if($line -match $pat){$s=[string]$line;if($userHome){$s=$s.Replace($userHome,'<USERPROFILE>')};$s=[regex]::Replace($s,'(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b','<redacted-email>');$s=[regex]::Replace($s,'(?i)\b(cookie|authorization|bearer|token|password|secret|api[_-]?key)\b\s*[:=]\s*[^\s,;]+','$1=<redacted>');$s=[regex]::Replace($s,'(?i)(https?://[^\s?#]+)(?:\?[^\s#]*)?(?:#[^\s]*)?','$1');if($s.Length-gt 500){$s=$s.Substring(0,500)+'<truncated>'};$safe+=$s}};if($safe.Count-eq 0){return '<no-safe-diagnostic-lines>'};return (($safe|Select-Object -Last 10)-join ' | ')}
            $diag=[ordered]@{schema='ainovel-w6d-r3-resume-diagnostic/1';release_commit=$env:RELEASE_AUTHORITY_SHA;tag=$env:RELEASE_TAG;smoke_pass=$false;error=$err;progress_exists=(Test-Path $progressPath);progress_sha256=$progressHash;phase=$phase;current_chapter=$current;completed_chapters=$completed;resume_exit_code=$resumeCode;chapter_file_count=$chapters.Count;session_file_count=$sessions.Count;first_stderr=SafeDiag (Join-Path $env:W6D_R3_EVIDENCE 'first.stderr.log');resume_stderr=SafeDiag (Join-Path $env:W6D_R3_EVIDENCE 'resume.stderr.log');headless_diagnostic=SafeDiag (Join-Path $env:W6D_R3_RUNTIME 'output\novel\headless.log');captured_at=(Get-Date).ToUniversalTime().ToString('o')}
            $diag|ConvertTo-Json -Depth 6|Set-Content (Join-Path $env:W6D_R3_EVIDENCE 'w6d-r3-resume-diagnostic.json') -Encoding UTF8
            Write-Host "W6D-R3 smoke failed; sanitized diagnostic captured: $err"
          }

      - name: Upload sanitized failure diagnostic
        if: env.W6D_R3_SMOKE_OK == 'False'
        uses: actions/upload-artifact@v4
        with:
          name: ainovel-w6d-r3-resume-diagnostic-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ env.W6D_R3_EVIDENCE }}/w6d-r3-resume-diagnostic.json

      - name: Validate successful W6D-R3 authority
        if: env.W6D_R3_SMOKE_OK == 'True'
        shell: powershell
        run: |
          $ev=Get-Content (Join-Path $env:W6D_R3_EVIDENCE 'w6d-published-windows-evidence.json') -Raw -Encoding UTF8|ConvertFrom-Json
          if($ev.schema-ne 'ainovel-w6d-published-windows/1' -or $ev.release_commit-ne $env:RELEASE_AUTHORITY_SHA -or $ev.tag-ne $env:RELEASE_TAG -or $ev.binary_source-ne 'github-release-live-asset' -or $ev.desktop_build_performed -or -not $ev.package_checksum_verified -or -not $ev.production_binary_commit_verified -or -not $ev.first_ready -or -not $ev.restart_ready -or -not $ev.restart_resume_detected -or $ev.runtime_no_api_marker_scan-ne 'PASS' -or $ev.w55_static_no_api_gate-ne 'PASS' -or -not $ev.no_upstream_fallback){throw 'W6D-R3 authority validation failed'}
          $completed=@($ev.completed_chapters|ForEach-Object{[int]$_});if($completed-notcontains 1 -or $completed-notcontains 2){throw 'chapter completion witness failed'}
          $tools=@($ev.observed_local_tools|ForEach-Object{[string]$_});foreach($t in @('draft_chapter','commit_chapter')){if($tools-notcontains $t){throw "missing tool witness: $t"}}
          if([string]$ev.chapter_1_sha256_before_restart-ne[string]$ev.chapter_1_sha256_after_restart){throw 'chapter 1 persistence failed'}
          Write-Host 'W6D-R3 LIVE RELEASE DESKTOP AUTHORITY: PASS'

      - name: Upload successful W6D-R3 authority
        if: env.W6D_R3_SMOKE_OK == 'True'
        uses: actions/upload-artifact@v4
        with:
          name: ainovel-w6d-r3-published-windows-authority-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.W6D_R3_EVIDENCE }}/w6d-published-windows-evidence.json
            ${{ env.W6D_R3_EVIDENCE }}/w6c-readiness-evidence.json
            ${{ env.W6D_R3_EVIDENCE }}/w6c-release-artifact-smoke-evidence.json

      - name: Assert smoke success after diagnostic upload
        shell: powershell
        run: |
          if($env:W6D_R3_SMOKE_OK-ne 'True'){throw 'W6D-R3 live release smoke failed; sanitized diagnostic artifact uploaded.'}

      - name: Clean transient W6D-R3 data
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Continue';foreach($p in @($env:W6D_R3_BASE,(Join-Path $env:RUNNER_TEMP ("w6d-r3-helper-"+$env:GITHUB_RUN_ID)))){if($p -and(Test-Path $p)){Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue}}
      - name: Restore local config exactly
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Continue';if(-not $env:W6D_R3_CFG){exit 0};if($env:W6D_R3_HAD-eq 'True'){if(Test-Path $env:W6D_R3_BAK){Copy-Item $env:W6D_R3_BAK $env:W6D_R3_CFG -Force;Remove-Item $env:W6D_R3_BAK -Force -ErrorAction SilentlyContinue}else{throw 'config backup missing'}}else{Remove-Item $env:W6D_R3_CFG -Force -ErrorAction SilentlyContinue};Write-Host 'W6D-R3 local config state restored.'
