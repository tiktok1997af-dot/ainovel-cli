name: W5E R1 authority d760

on:
  push:
    branches:
      - w5e-r1-authority-d760

permissions:
  contents: read

concurrency:
  group: w5e-r1-real-desktop
  cancel-in-progress: true

env:
  W5E_CANDIDATE_SHA: d7609633352d9f3a23ccc558b1f4e0a72e664a58

jobs:
  authority:
    name: Real Windows desktop / structural Resume authority
    runs-on: [self-hosted, Windows, X64, ainovel-w5e-desktop]
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.W5E_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Force Git Bash and verify interactive desktop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:W5E_CANDIDATE_SHA) { throw "Candidate drift: $actual" }
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          $bash = Join-Path $gitBin 'bash.exe'
          if (-not (Test-Path -LiteralPath $bash)) { throw 'Git Bash missing' }
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$gitBin`r`n", (New-Object System.Text.UTF8Encoding($false)))
          $session = (Get-Process -Id $PID).SessionId
          $explorer = Get-Process explorer -ErrorAction SilentlyContinue | Where-Object { $_.SessionId -eq $session } | Select-Object -First 1
          if ($null -eq $explorer) { throw 'Runner is not in an interactive Windows desktop session' }
          if ([string]::IsNullOrWhiteSpace((Get-CimInstance Win32_ComputerSystem).UserName)) { throw 'No interactive logged-on user' }
          Write-Host "Authority precondition PASS: $actual / session $session"

      - name: Stage transient WEB-only config
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $userHome = [Environment]::GetFolderPath('UserProfile')
          $configDir = Join-Path $userHome '.ainovel'
          $configPath = Join-Path $configDir 'config.json'
          $backupPath = Join-Path $env:RUNNER_TEMP ("w5e-config-backup-" + $env:GITHUB_RUN_ID + ".json")
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          $hadOriginal = Test-Path -LiteralPath $configPath
          $profileName = 'default'; $browserPath = ''; $startUrl = ''
          if ($hadOriginal) {
            Copy-Item -LiteralPath $configPath -Destination $backupPath -Force
            try {
              $existing = Get-Content -LiteralPath $configPath -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($null -ne $existing.web) {
                if (-not [string]::IsNullOrWhiteSpace([string]$existing.web.profile_name)) { $profileName = [string]$existing.web.profile_name }
                if (-not [string]::IsNullOrWhiteSpace([string]$existing.web.browser_path)) { $browserPath = [string]$existing.web.browser_path }
                if (-not [string]::IsNullOrWhiteSpace([string]$existing.web.start_url)) { $startUrl = [string]$existing.web.start_url }
              }
            } catch { }
          }
          $web = [ordered]@{ enabled=$true; site='gemini-web'; profile_name=$profileName }
          if ($browserPath) { $web.browser_path = $browserPath }
          if ($startUrl) { $web.start_url = $startUrl }
          $cfg = [ordered]@{ web=$web; language='vi' }
          [System.IO.File]::WriteAllText($configPath, (($cfg | ConvertTo-Json -Depth 6) + "`r`n"), (New-Object System.Text.UTF8Encoding($false)))
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, ("W5E_LOCAL_CONFIG_PATH=$configPath`r`nW5E_LOCAL_CONFIG_BACKUP=$backupPath`r`nW5E_LOCAL_CONFIG_HAD_ORIGINAL=$hadOriginal`r`n"), (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Transient WEB-only config staged for profile '$profileName'."

      - name: Run real production desktop smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDir = Join-Path $env:RUNNER_TEMP ("ainovel-w5e-r1-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "W5E_EVIDENCE_DIR=$evidenceDir`r`n", (New-Object System.Text.UTF8Encoding($false)))
          if ($null -eq (Get-Variable IsWindows -Scope Global -ErrorAction SilentlyContinue)) { $global:IsWindows = $true }
          try {
            & ./scripts/w5e-production-smoke.ps1 -RepoRoot $env:GITHUB_WORKSPACE -EvidenceDir $evidenceDir -ReadinessTimeoutSeconds 60 -FirstChapterTimeoutSeconds 1200 -ResumeTimeoutSeconds 1200
          } catch {
            $message = [string]$_.Exception.Message
            $userHome = [Environment]::GetFolderPath('UserProfile')
            if ($userHome) { $message = $message.Replace($userHome, '<USERPROFILE>') }
            $message = [regex]::Replace($message, '(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b', '<redacted-email>')
            $message = [regex]::Replace($message, '(?i)\b(cookie|authorization|bearer|token|password|secret|api[_-]?key)\b\s*[:=]\s*[^\s,;]+', '$1=<redacted>')
            $message = [regex]::Replace($message, '(?i)(https?://[^\s?#]+)(?:\?[^\s#]*)?(?:#[^\s]*)?', '$1')
            if ($message.Length -gt 4000) { $message = $message.Substring(0,4000) + '<truncated>' }
            $diag = [ordered]@{ schema='ainovel-w5e-desktop-failure/1'; candidate_sha=$env:W5E_CANDIDATE_SHA; run_id=[string]$env:GITHUB_RUN_ID; stage='production-smoke'; error=$message; captured_at=(Get-Date).ToUniversalTime().ToString('o') }
            $diag | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $evidenceDir 'w5e-desktop-failure-diagnostic.json') -Encoding UTF8
            throw
          }

      - name: Upload sanitized failure diagnostic only
        if: failure() && env.W5E_EVIDENCE_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: w5e-r1-d760-failure-diagnostic
          path: ${{ env.W5E_EVIDENCE_DIR }}/w5e-desktop-failure-diagnostic.json
          if-no-files-found: warn
          retention-days: 7

      - name: Validate sanitized authority evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:W5E_EVIDENCE_DIR 'w5e-production-smoke-evidence.json'
          if (-not (Test-Path -LiteralPath $path)) { throw 'Missing authority evidence' }
          $ev = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$ev.schema -ne 'ainovel-w5e-production-smoke/1') { throw 'Unexpected evidence schema' }
          if ([string]$ev.git_sha -ne $env:W5E_CANDIDATE_SHA) { throw 'Evidence candidate SHA mismatch' }
          if (-not [bool]$ev.first_ready -or -not [bool]$ev.restart_ready -or -not [bool]$ev.restart_resume_detected) { throw 'READY/restart/resume evidence incomplete' }
          if ([string]$ev.resume_invocation_mode -ne 'headless-existing-state') { throw 'Resume invocation mode is not structural existing-state mode' }
          $beforeProgress = [string]$ev.resume_progress_sha256_before_restart
          $afterProgress = [string]$ev.resume_progress_sha256_after_resume
          if ([string]::IsNullOrWhiteSpace($beforeProgress) -or [string]::IsNullOrWhiteSpace($afterProgress) -or $beforeProgress -eq $afterProgress) { throw 'Resume progress hash transition is missing' }
          if ([string]$ev.runtime_no_api_marker_scan -ne 'PASS' -or [string]$ev.w55_static_no_api_gate -ne 'PASS') { throw 'NO-API gate evidence incomplete' }
          if ([string]$ev.chapter_1_sha256_before_restart -ne [string]$ev.chapter_1_sha256_after_restart) { throw 'Chapter 1 hash mismatch' }
          $tools = @($ev.observed_local_tools | ForEach-Object { [string]$_ })
          foreach ($tool in @('draft_chapter','commit_chapter')) { if ($tools -notcontains $tool) { throw "Missing tool evidence: $tool" } }
          $completed = @($ev.final_progress.completed_chapters | ForEach-Object { [int]$_ })
          if ($completed -notcontains 1 -or $completed -notcontains 2) { throw 'Final progress lacks chapters 1 and 2' }
          Write-Host 'W5E-R1 REAL DESKTOP PRODUCTION EXECUTION: PASS'

      - name: Upload sanitized authority evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: w5e-r1-d760-production-smoke-evidence
          path: |
            ${{ env.W5E_EVIDENCE_DIR }}/w5e-production-smoke-evidence.json
            ${{ env.W5E_EVIDENCE_DIR }}/w5e-readiness-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Restore local config exactly
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          if ([string]::IsNullOrWhiteSpace($env:W5E_LOCAL_CONFIG_PATH)) { exit 0 }
          if ($env:W5E_LOCAL_CONFIG_HAD_ORIGINAL -eq 'True') {
            if (Test-Path -LiteralPath $env:W5E_LOCAL_CONFIG_BACKUP) {
              Copy-Item -LiteralPath $env:W5E_LOCAL_CONFIG_BACKUP -Destination $env:W5E_LOCAL_CONFIG_PATH -Force
              Remove-Item -LiteralPath $env:W5E_LOCAL_CONFIG_BACKUP -Force -ErrorAction SilentlyContinue
            } else { Write-Error 'Expected config backup missing'; exit 1 }
          } else {
            Remove-Item -LiteralPath $env:W5E_LOCAL_CONFIG_PATH -Force -ErrorAction SilentlyContinue
          }
