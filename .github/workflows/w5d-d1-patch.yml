name: W5D D1 guarded patch

on:
  push:
    branches:
      - w5d-cost-update-docs-safety

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[w5d-d1-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w5d-cost-update-docs-safety
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Apply guarded D1 patch
        run: python3 .github/scripts/w5d_patch_d1.py
      - name: Format changed Go files
        run: gofmt -w internal/host/host.go internal/host/engine.go
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No D1 source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/host/host.go internal/host/engine.go
          git commit -m "refactor(w5d): remove runtime USD budget hooks [w5d-d1-patch]"
          git push origin HEAD:w5d-cost-update-docs-safety
